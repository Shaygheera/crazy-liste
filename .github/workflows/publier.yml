# À chaque envoi sur main : tous les tests dans Chrome, puis publication sur GitHub Pages seulement s'ils passent.
name: Tester et publier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (logique + Chrome, TMDB et Firebase simulés)
        run: npm test
        env:
          TZ: Europe/Paris
      - name: Version publique
        run: node tools/build-public.mjs firebase-config.json public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: tester
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
