<style>
:root {
  color-scheme: dark;
  --bg: #0b0e14; --bg-elev: #0f131b; --surface: #151a24; --surface-2: #1c2230; --surface-3: #262d3e;
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #eef2f8; --text-2: #b9c1cf; --muted: #8a94a7;
  --accent: #5ad1e6; --accent-ink: #04161b; --accent-soft: rgba(90,209,230,.14);
  --fav: #ff6b9a; --fav-soft: rgba(255,107,154,.15);
  --watch: #b197fc; --watch-soft: rgba(177,151,252,.15);
  --seen: #3ccf7a; --seen-soft: rgba(60,207,122,.14); --seen-ink: #03210e;
  --progress: #f5b83d; --progress-soft: rgba(245,184,61,.14); --progress-ink: #2b1a00;
  --todo: #93a6cc; --todo-soft: rgba(147,166,204,.12); --todo-ink: #0b1426;
  --danger: #ff6b6b; --danger-soft: rgba(255,107,107,.13);
  --r-top: #22c46d; --r-good: #82c341; --r-mid: #e8c33a; --r-low: #f08a2e; --r-bad: #e5534b; --r-none: #59627a;
  --shadow: 0 12px 32px rgba(0,0,0,.38);
  --radius-sm: 9px; --radius: 13px; --radius-lg: 18px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5f9; --bg-elev: #eceff5; --surface: #ffffff; --surface-2: #eef1f6; --surface-3: #e2e7ef;
  --border: rgba(16,24,40,.09); --border-strong: rgba(16,24,40,.18);
  --text: #141b2b; --text-2: #3b4559; --muted: #5d6880;
  --accent: #0b8fa6; --accent-ink: #ffffff; --accent-soft: rgba(11,143,166,.11);
  --fav: #d6336c; --fav-soft: rgba(214,51,108,.1);
  --watch: #6f4fd8; --watch-soft: rgba(111,79,216,.1);
  --seen: #1f9d55; --seen-soft: rgba(31,157,85,.11); --seen-ink: #ffffff;
  --progress: #c97a00; --progress-soft: rgba(201,122,0,.11); --progress-ink: #ffffff;
  --todo: #4f6390; --todo-soft: rgba(79,99,144,.1); --todo-ink: #ffffff;
  --danger: #d63939; --danger-soft: rgba(214,57,57,.1);
  --shadow: 0 10px 28px rgba(20,30,50,.12);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { line-height: 1.2; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 18px; height: 18px; flex: none; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; }
.skip-link:focus { top: 12px; }

/* ---------- Mise en page ---------- */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr) 330px; grid-template-areas: "nav main side"; min-height: 100vh; }
.sidebar { grid-area: nav; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; border-right: 1px solid var(--border); background: var(--bg-elev); }
.main-col { grid-area: main; min-width: 0; display: flex; flex-direction: column; }
.side-panel { grid-area: side; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 14px; border-left: 1px solid var(--border); background: var(--bg-elev); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 4px 6px; }
.brand-logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--watch)); color: #061015; font-weight: 900; font-size: .95rem; letter-spacing: -.02em; flex: none; }
.brand-name { display: block; font-weight: 800; font-size: 1.12rem; letter-spacing: -.01em; }
.brand-sub { display: block; font-size: .76rem; color: var(--muted); }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: var(--text-2); font-weight: 600; font-size: .92rem; }
.nav a:hover { background: var(--surface); color: var(--text); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: .72rem; font-weight: 700; text-align: center; line-height: 20px; }
.nav .count:empty { display: none; }
.sidebar-foot { margin-top: auto; display: grid; gap: 8px; }
.sync-chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; font-size: .8rem; font-weight: 600; color: var(--text-2); text-decoration: none; background: var(--surface); }
.sync-chip[hidden] { display: none; }
.sync-chip:hover { color: var(--text); }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.sync-ok .sync-dot { background: var(--seen); } .sync-warn .sync-dot { background: var(--progress); } .sync-err .sync-dot { background: var(--danger); }
.sync-line { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 22px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.topbar .brand { display: none; }
.topbar .topbar-settings { display: none; }
.topbar .topbar-settings[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (max-width: 899px) { .topbar .topbar-settings { display: inline-flex; } .searchbar .btn { padding: 4px 8px; } }
.searchbar { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; max-width: 720px; padding: 4px 4px 4px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); }
.searchbar:focus-within { border-color: var(--accent); }
.searchbar input { flex: 1 1 auto; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; padding: 7px 0; font-size: .95rem; }
.topbar > .brand, .topbar > .btn { flex: none; }
.searchbar input::-webkit-search-cancel-button { cursor: pointer; }
.view { padding: 20px 22px 40px; min-width: 0; outline: none; flex: 1; }
.bottom-nav { display: none; }
@media (max-width: 1279px) {
  .app { grid-template-columns: 212px minmax(0, 1fr); grid-template-areas: "nav main" "nav side"; }
  .side-panel { position: static; height: auto; border-left: 0; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; padding: 16px 22px 28px; }
}
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "side"; }
  .sidebar { display: none; }
  .topbar { padding: 10px 14px; gap: 10px; }
  .topbar .brand { display: flex; padding: 0; }
  .topbar .brand-text { display: none; }
  .view { padding: 16px 16px 28px; }
  .side-panel { padding: 14px 16px 92px; grid-template-columns: minmax(0, 1fr); }
  .bottom-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg-elev); border-top: 1px solid var(--border); padding: 5px 4px calc(5px + env(safe-area-inset-bottom)); }
  .bottom-nav a { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: .68rem; font-weight: 600; white-space: nowrap; }
  .bottom-nav a[aria-current="page"] { color: var(--accent); }
  .bottom-nav .icon { width: 21px; height: 21px; }
}

/* ---------- Éléments communs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: .85rem; font-weight: 650; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color .12s, border-color .12s, color .12s; }
.btn:hover { background: var(--surface-3); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: transparent; }
.btn-sm { min-height: 30px; padding: 4px 10px; font-size: .79rem; border-radius: 9px; }
.btn-icon { width: 34px; padding: 0; }
.btn-fav[aria-pressed="true"] { background: var(--fav-soft); border-color: var(--fav); color: var(--fav); }
.btn-watch[aria-pressed="true"] { background: var(--watch-soft); border-color: var(--watch); color: var(--watch); }
.btn.is-busy { opacity: .7; cursor: progress; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: .76rem; font-weight: 600; white-space: nowrap; }
.chip-btn { cursor: pointer; padding: 6px 12px; font-size: .82rem; }
.chip-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.status { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 750; border: 1px solid transparent; white-space: nowrap; }
.status::before { font-size: .8em; line-height: 1; }
.status-todo { color: var(--todo); background: var(--todo-soft); border-color: color-mix(in srgb, var(--todo) 40%, transparent); }
.status-todo::before { content: "○"; }
.status-progress { color: var(--progress); background: var(--progress-soft); border-color: color-mix(in srgb, var(--progress) 45%, transparent); }
.status-progress::before { content: "◐"; }
.status-seen { color: var(--seen); background: var(--seen-soft); border-color: color-mix(in srgb, var(--seen) 45%, transparent); }
.status-seen::before { content: "✓"; }
.rating { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 24px; padding: 0 7px; border-radius: 7px; font-size: .78rem; font-weight: 800; color: #fff; background: var(--r-none); box-shadow: 0 1px 3px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.rating-top { background: var(--r-top); } .rating-good { background: var(--r-good); color: #0f1a05; } .rating-mid { background: var(--r-mid); color: #221a00; }
.rating-low { background: var(--r-low); color: #261200; } .rating-bad { background: var(--r-bad); }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 32px; padding: 4px 10px; border: 0; background: transparent; color: var(--text-2); font-size: .79rem; font-weight: 650; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button:hover { background: var(--surface-3); color: var(--text); }
.seg button[aria-pressed="true"] { font-weight: 800; }
.seg button[aria-pressed="true"]::before { content: "✓"; font-weight: 900; }
.seg button[aria-pressed="true"][data-status="todo"] { background: var(--todo-soft); color: var(--text); box-shadow: inset 0 0 0 2px var(--todo); }
.seg button[aria-pressed="true"][data-status="progress"] { background: var(--progress); color: var(--progress-ink); }
.seg button[aria-pressed="true"][data-status="seen"] { background: var(--seen); color: var(--seen-ink); }
.seg-lg button { min-height: 38px; padding: 6px 14px; font-size: .86rem; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: var(--radius); font-size: .9rem; }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; font-size: .98rem; }
.empty .btn { margin-top: 10px; }
.error-box { padding: 14px 16px; border-radius: var(--radius); background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); color: var(--text); font-size: .88rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.error-box p { margin: 0; flex: 1 1 220px; }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 22px 0; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); font-size: .86rem; }
.banner p { margin: 0; flex: 1 1 260px; }
.banner-warn { border-color: color-mix(in srgb, var(--progress) 50%, transparent); background: var(--progress-soft); }
.banner-error { border-color: color-mix(in srgb, var(--danger) 50%, transparent); background: var(--danger-soft); }
.banner-info { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
@media (max-width: 899px) { .banner { margin: 10px 16px 0; } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { margin: 0; font-size: 1.55rem; letter-spacing: -.015em; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .spacer { flex: 1; }
.select { min-height: 32px; padding: 4px 10px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface-2); font-size: .82rem; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
.tabs a { padding: 6px 12px; border-radius: 9px; text-decoration: none; font-weight: 650; font-size: .86rem; color: var(--text-2); }
.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.skeleton { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-3) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: var(--radius); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.progress-bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--seen); }

/* ---------- Cartes ---------- */
.section { margin-bottom: 26px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-head h2 { margin: 0; font-size: 1.12rem; letter-spacing: -.01em; }
.rail-nav { display: flex; gap: 6px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 166px; gap: 14px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; padding: 2px 2px 10px; scrollbar-width: thin; }
.rail > * { scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 14px; }
@media (max-width: 899px) { .rail { grid-auto-columns: 142px; gap: 10px; } .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; } .rail-nav { display: none; } }
.card { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease; }
.card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); }
.card-link { color: inherit; text-decoration: none; }
.card-link::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.card-link:focus-visible { outline: none; }
.card:has(.card-link:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.poster { position: relative; aspect-ratio: 2 / 3; background: var(--surface-2); overflow: hidden; }
.poster img { position: relative; width: 100%; height: 100%; object-fit: cover; }
.poster-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; text-align: center; color: var(--muted); font-size: .8rem; font-weight: 650; background: linear-gradient(160deg, var(--surface-2), var(--surface-3)); }
.poster .rating { position: absolute; top: 7px; left: 7px; }
.poster .type-tag { position: absolute; top: 7px; right: 7px; padding: 2px 7px; border-radius: 6px; font-size: .68rem; font-weight: 800; background: rgba(8,10,16,.78); color: #fff; }
.card-body { display: flex; flex-direction: column; gap: 5px; padding: 9px 10px 10px; flex: 1; }
.card-title { margin: 0; font-size: .9rem; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: .76rem; }
.card-overview { margin: 0; color: var(--text-2); font-size: .76rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-actions { position: relative; z-index: 2; display: grid; gap: 6px; margin-top: auto; padding-top: 4px; }
.card-actions .btn { width: 100%; padding: 4px 6px; }
.card-skeleton { aspect-ratio: 2 / 3.9; }

/* ---------- Fiche ---------- */
.detail-hero { position: relative; overflow: hidden; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); margin-bottom: 18px; }
.detail-backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .22; }
.detail-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--surface) 15%, color-mix(in srgb, var(--surface) 70%, transparent) 60%, color-mix(in srgb, var(--surface) 45%, transparent)); }
.detail-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 22px; padding: 20px; }
.detail-side { display: grid; gap: 14px; align-content: start; min-width: 0; }
.detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px 18px; flex-wrap: wrap; }
.detail-titles { flex: 1 1 320px; min-width: 0; }
.detail-sub { margin: 4px 0 0; color: var(--muted); font-size: .86rem; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.genre-tag { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
.kicker { margin: 0; font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 750; }
.dcard { display: grid; gap: 10px; padding: 12px 16px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: color-mix(in srgb, var(--surface-2) 75%, transparent); }
.dcard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.dcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
.dcols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dcol[data-col="suite"] .dcol-big a { color: var(--accent); }
.dlicence { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding-top: 10px; border-top: 1px solid var(--border); }
.dlicence-label { font-size: .8rem; color: var(--muted); font-weight: 650; margin-right: 2px; }
.lic { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 3px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: inherit; text-decoration: none; font-size: .8rem; font-weight: 650; max-width: 100%; }
a.lic:hover { border-color: var(--accent); }
.lic-current { border-color: var(--accent); background: var(--accent-soft); }
.lic-thumb { position: relative; width: 22px; height: 32px; border-radius: 4px; overflow: hidden; flex: none; background: var(--surface-2); }
.lic-thumb .poster-fallback { display: none; } .lic-thumb img { width: 100%; height: 100%; object-fit: cover; }
.lic-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lic-seen { color: var(--seen); font-weight: 800; }
.dcol { display: grid; gap: 3px; align-content: start; min-width: 0; }
.dcol + .dcol { border-left: 1px solid var(--border); padding-left: 18px; }
.dcol-label { font-size: .78rem; color: var(--muted); }
.dcol-big { font-size: 1.02rem; font-weight: 750; overflow-wrap: anywhere; }
.dcol-big a { color: inherit; text-decoration: none; } .dcol-big a:hover { color: var(--accent); text-decoration: underline; }
.dcol-sub { font-size: .8rem; color: var(--muted); } .dcol-sub b { color: var(--text); }

/* Frise en serpent : les titres alternent au-dessus et au-dessous d'une ligne, en se chevauchant d'une demi-carte. */
.snake { --snake-col: 112px; list-style: none; margin: 0; padding: 6px 2px 14px; display: grid; grid-template-rows: auto 34px auto; overflow-x: auto; scroll-snap-type: x proximity; }
.snake-line { grid-row: 2; align-self: center; height: 4px; border-radius: 99px; background: linear-gradient(90deg, var(--saga), color-mix(in srgb, var(--saga) 35%, var(--border))); }
.snake-item { position: relative; display: flex; padding: 0 6px; scroll-snap-align: start; min-width: 0; }
.snake-item.up { grid-row: 1; align-items: flex-end; }
.snake-item.down { grid-row: 3; align-items: flex-start; }
.snake-item::before { content: ""; position: absolute; left: 50%; width: 2px; height: 17px; background: var(--saga); transform: translateX(-1px); }
.snake-item::after { content: ""; position: absolute; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 3px solid var(--saga); transform: translateX(-6px); }
.snake-item.up::before { bottom: -17px; } .snake-item.up::after { bottom: -23px; }
.snake-item.down::before { top: -17px; } .snake-item.down::after { top: -23px; }
.snake-item.seen::after { background: var(--seen); border-color: var(--seen); }
.snake-card { position: relative; display: flex; gap: 10px; width: 100%; padding: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
.snake-card:hover { border-color: var(--saga); transform: translateY(-1px); }
.snake-poster { flex: none; width: 50px; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.snake-poster img { width: 100%; height: 100%; object-fit: cover; }
.snake-text { display: grid; align-content: start; gap: 3px; min-width: 0; font-size: .78rem; }
.snake-text strong { font-size: .84rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.snake-num { color: var(--saga); font-weight: 800; font-size: .7rem; }
.snake-date { color: var(--muted); }
.snake-text .status { justify-self: start; }
.snake-flag { justify-self: start; padding: 1px 7px; border-radius: 99px; font-size: .68rem; font-weight: 800; background: var(--saga); color: #fff; }
.snake-flag.soon { background: transparent; color: var(--muted); border: 1px dashed var(--border-strong); }
.snake-item.upcoming .snake-card { border-style: dashed; opacity: .78; }
.snake-item.is-next .snake-card { border-color: var(--saga); box-shadow: 0 0 0 2px color-mix(in srgb, var(--saga) 45%, transparent); }
.snake-item.seen .snake-card { border-color: color-mix(in srgb, var(--seen) 55%, var(--border)); }
@media (max-width: 699px) {
  .snake { display: block; padding: 0 0 0 26px; position: relative; overflow: visible; grid-template-columns: none !important; }
  .snake-line { position: absolute; left: 9px; top: 0; bottom: 0; width: 4px; height: auto; background: linear-gradient(180deg, var(--saga), color-mix(in srgb, var(--saga) 35%, var(--border))); }
  .snake-item { padding: 0 0 10px; }
  .snake-item::before { left: -17px; top: 26px !important; bottom: auto !important; width: 17px; height: 2px; transform: none; }
  .snake-item::after { left: -23px; top: 20px !important; bottom: auto !important; transform: none; }
}

.bars { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
.bars li { display: grid; grid-template-columns: minmax(90px, 40%) 1fr 28px; gap: 8px; align-items: center; font-size: .84rem; }
.bar-track { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; } .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar-value { text-align: right; font-weight: 650; }
.month-chart { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 170px; margin-top: 10px; }
.month { display: grid; grid-template-rows: 18px 1fr 30px; height: 100%; text-align: center; font-size: .7rem; min-width: 0; }
.month-bar { display: flex; align-items: flex-end; justify-content: center; } .month-bar span { width: 70%; min-height: 2px; background: var(--accent); border-radius: 4px 4px 0 0; }
.month-label { color: var(--muted); line-height: 1.15; overflow-wrap: anywhere; } .month-value { font-weight: 650; }
.resume-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.resume-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 10px; text-decoration: none; }
.resume-row:hover { background: var(--surface-2); }
.resume-thumb { position: relative; width: 34px; height: 51px; border-radius: 6px; overflow: hidden; background: var(--surface-3); }
.resume-thumb img { position: relative; width: 100%; height: 100%; object-fit: cover; }
.resume-thumb .poster-fallback { font-size: .6rem; padding: 2px; }
.resume-text { min-width: 0; display: grid; gap: 2px; }
.resume-title { font-weight: 650; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resume-sub { color: var(--muted); font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resume-row .progress-bar { height: 3px; } .resume-row .progress-bar > span { background: var(--progress); }
.resume-rank { font-size: .72rem; color: var(--muted); font-weight: 750; font-variant-numeric: tabular-nums; }
.resume-page .resume-row { grid-template-columns: 52px minmax(0, 1fr) auto; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); }
.resume-page .resume-thumb { width: 52px; height: 78px; }
.resume-page .resume-title { font-size: .98rem; }
.resume-page .resume-sub { font-size: .8rem; }
.related { display: grid; gap: 12px; font-size: .86rem; }

.related-box { padding: 10px; border-radius: 10px; background: var(--surface-2); display: grid; gap: 4px; }

.related-box .muted { color: var(--muted); font-size: .78rem; }
.related-link { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; text-decoration: none; padding: 4px; border-radius: 8px; }
.related-link:hover { background: var(--surface-3); }
.related-note { font-size: .74rem; color: var(--muted); margin: 0 0 4px; }
.related-list { display: grid; gap: 2px; }

/* ---------- Réglages, dialogues, toasts ---------- */
.settings { display: grid; gap: 14px; max-width: 760px; }
.settings .panel { padding: 16px; }
.settings h2 { font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--text); margin-bottom: 6px; }
.settings p { margin: 6px 0; color: var(--text-2); font-size: .88rem; }
.field { display: grid; gap: 6px; margin: 10px 0; }
.field label { font-weight: 650; font-size: .86rem; }
.input { width: 100%; min-height: 38px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: .8rem; color: var(--muted); }
.ok-text { color: var(--seen); font-weight: 650; } .err-text { color: var(--danger); font-weight: 650; }
dialog.dialog { width: min(92vw, 480px); padding: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

@media (max-width: 899px) { .toasts { bottom: 78px; } }

<script id="crazy-core">
/* Crazy Liste — logique métier pure : aucun accès au DOM, au réseau ni au stockage.
   Ce bloc est exécuté tel quel par tests/core.test.mjs (Node). */
(function (root) {
  'use strict';

  const SCHEMA_VERSION = 1;
  const STATUSES = Object.freeze(['todo', 'progress', 'seen']);
  const STATUS_LABELS = Object.freeze({ todo: 'À voir', progress: 'En cours', seen: 'Vu' });
  const TYPE_LABELS = Object.freeze({ movie: 'Film', tv: 'Série / anime' });
  const PRODUCTION_LABELS = Object.freeze({
    'Returning Series': 'Pas terminée', 'Ended': 'Terminée', 'Canceled': 'Annulée',
    'In Production': 'En production', 'Planned': 'Prévue', 'Pilot': 'Pilote', 'Released': 'Sorti',
    'Post Production': 'Post-production', 'Rumored': 'Annoncé', 'Upcoming': 'À venir'
  });
  const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const MAX_TIME = 4102444800000; // 2100-01-01

  const isStatus = (s) => STATUSES.includes(s);
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
  const isPosInt = (v) => Number.isInteger(v) && v > 0;
  const isIntKey = (k) => /^\d{1,6}$/.test(String(k));
  const str = (v, max = 2000) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, max);
  const validTime = (v) => { const n = Number(v); return Number.isFinite(n) && n > 0 && n < MAX_TIME ? Math.trunc(n) : 0; };

  /* ---------- Clés, échappement, formats ---------- */
  function itemKey(type, id) { return type + '-' + id; }
  function parseKey(key) {
    const m = /^(movie|tv)-(\d{1,10})$/.exec(String(key));
    if (!m) return null;
    const id = Number(m[2]);
    return id > 0 ? { type: m[1], id, key: itemKey(m[1], id) } : null;
  }
  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function yearOf(date) { return /^\d{4}/.test(date || '') ? String(date).slice(0, 4) : ''; }
  function imgPath(p) { return typeof p === 'string' && /^\/[\w.-]{1,200}$/.test(p) ? p : null; }
  function formatDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return '';
    const mo = Number(m[2]), d = Number(m[3]);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    return (d === 1 ? '1er' : String(d)) + ' ' + MONTHS[mo - 1] + ' ' + m[1];
  }
  function ratingTier(v) {
    const n = num(v);
    if (n <= 0) return 'none';
    if (n >= 8) return 'top';
    if (n >= 7) return 'good';
    if (n >= 6) return 'mid';
    if (n >= 5) return 'low';
    return 'bad';
  }
  function formatRating(v) { const n = num(v); return n > 0 ? n.toFixed(1).replace('.', ',') : '—'; }
  /* « Returning Series » signifie seulement que TMDB n'a pas marqué la série comme terminée (statut tenu par la communauté,
     parfois en retard) : elle n'est « en cours de diffusion » que si TMDB annonce un prochain épisode. On n'en déduit aucune suite. */
  /* « En cours de diffusion » : un épisode sort dans les AIRING_DAYS prochains jours (diffusion hebdomadaire).
     Un prochain épisode plus lointain signifie une suite annoncée (nouvelle saison, reprise après une pause). */
  const AIRING_DAYS = 14;
  function isAiringSoon(nextEpisode, today) {
    if (!nextEpisode || !/^\d{4}-\d{2}-\d{2}$/.test(nextEpisode.airDate || '')) return false;
    const n = daysBetween(today, nextEpisode.airDate);
    return n >= 0 && n <= AIRING_DAYS;
  }
  /* Suite annoncée (pas en cours de diffusion) : prochain épisode lointain, ou saison à venir listée par TMDB (avec ou sans date).
     info : { status, nextEpisode, seasons } tiré de la fiche. Renvoie { date ('' si inconnue), season } ou null. */
  const ANNOUNCE_SPLIT_DAYS = 183;
  const NEEDS_DETAIL_STATUSES = ['soon', 'later']; // la découverte TMDB ne sait pas filtrer les saisons annoncées : vérifié sur chaque fiche // « moins de 6 mois » / « plus de 6 mois »
  function announcedSeason(info, today) {
    if (!isObj(info) || ENDED_STATUSES.includes(info.status) || isAiringSoon(info.nextEpisode, today)) return null;
    const isDate = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d || '');
    const ne = info.nextEpisode;
    if (ne && (!isDate(ne.airDate) || ne.airDate >= today)) return { date: isDate(ne.airDate) ? ne.airDate : '', season: ne.season };
    const sum = (Array.isArray(info.seasons) ? info.seasons : []).find((x) => x.number > 0 && (isDate(x.airDate) ? x.airDate >= today : x.episodeCount === 0));
    return sum ? { date: isDate(sum.airDate) ? sum.airDate : '', season: sum.number } : null;
  }
  /* Saison du prochain épisode annoncé : nombre d'épisodes prévus (liste des épisodes si chargée, sinon nombre annoncé par TMDB),
     épisodes déjà diffusés, dernier épisode prévu et sa date (vide si TMDB ne l'a pas encore). season : saison chargée ou null. */
  function airingSeasonInfo(d, season, today) {
    if (!d || !d.nextEpisode) return null;
    const n = d.nextEpisode.season;
    const sum = (Array.isArray(d.seasonSummaries) ? d.seasonSummaries : []).find((x) => x.number === n);
    const eps = season && season.number === n && season.episodes.length ? season.episodes : null;
    const isDate = (x) => /^\d{4}-\d{2}-\d{2}$/.test(x || '');
    const total = eps ? eps.length : sum ? sum.episodeCount : 0;
    let aired;
    if (eps) aired = eps.filter((e) => isDate(e.airDate) && e.airDate < today).length;
    else aired = d.lastEpisode && d.lastEpisode.season === n ? Math.max(0, d.lastEpisode.episode) : 0; // estimation avant chargement de la saison
    const last = eps ? eps[eps.length - 1] : null;
    const datedUntil = eps ? eps.filter((e) => isDate(e.airDate)).pop() : null;
    return { season: n, total, aired: Math.min(aired, total), remaining: Math.max(0, total - aired), exact: !!eps, listed: !!sum,
      started: aired > 0, lastNumber: last ? last.number : null, lastDate: last && isDate(last.airDate) ? last.airDate : '',
      datedUntil: datedUntil && datedUntil !== last ? { number: datedUntil.number, date: datedUntil.airDate } : null };

      else { t.intent = 'progress'; if (st === 'seen') { t.legacy = { status: 'seen' }; report.legacySeen++; } }
    }
    for (const [k, t] of Object.entries(tracking)) {
      if (C.hasActivity(t)) t.intent = null;

  function migrateLegacySources(sources) {
    let data = emptyData();
    const reports = [];
    for (const { key, raw } of sources) {
      const res = key === 'cinevault-watch' ? migrateCinevault(raw) : migrateLegacyCinelog(raw);
      reports.push(Object.assign({ source: key }, res.report));

  /* ---------- Fusion / remplacement ---------- */
  function mergeData(current, incoming) {
    const out = { schemaVersion: C.SCHEMA_VERSION, tracking: {}, metadata: {}, preferences: sanitizePreferences(current.preferences) };
    for (const [k, t] of Object.entries(current.tracking || {})) { out.tracking[k] = C.cloneTrack(t); out.metadata[k] = (current.metadata || {})[k] || C.placeholderMeta(k); }
    let added = 0, updated = 0;
    for (const [k, inc] of Object.entries(incoming.tracking || {})) {
      const incMeta = (incoming.metadata || {})[k];
      const cur = out.tracking[k];
      if (!cur) {
        out.tracking[k] = C.cloneTrack(inc);
        out.metadata[k] = incMeta || C.placeholderMeta(k);
        added++;
        continue;
      }
      const newer = (inc.lastActivityAt || 0) > (cur.lastActivityAt || 0);
      const merged = C.cloneTrack(newer ? inc : cur); // la progression la plus récente l'emporte
      merged.favorite = cur.favorite || inc.favorite;
      merged.watchlist = cur.watchlist || inc.watchlist;
      merged.inLibrary = cur.inLibrary || inc.inLibrary;
      const added0 = [cur.addedAt, inc.addedAt].filter((x) => x > 0);
      merged.addedAt = added0.length ? Math.min(...added0) : 0;
      merged.lastActivityAt = Math.max(cur.lastActivityAt || 0, inc.lastActivityAt || 0);
      if (JSON.stringify(merged) !== JSON.stringify(cur)) updated++;
      out.tracking[k] = merged;
      const curMeta = out.metadata[k];

  }
  function replaceData(current, incoming) {
    const out = { schemaVersion: C.SCHEMA_VERSION, tracking: {}, metadata: {}, preferences: sanitizePreferences(current.preferences) };
    for (const [k, t] of Object.entries(incoming.tracking || {})) { out.tracking[k] = C.cloneTrack(t); out.metadata[k] = (incoming.metadata || {})[k] || C.placeholderMeta(k); }
    return { data: out, report: { added: Object.keys(out.tracking).length, updated: 0 } };
  }

  /* ---------- Import ---------- */
  function summarize(data) {
    const t = Object.values(data.tracking);
    let episodes = 0;
    for (const x of t) for (const s of Object.values(x.seasons || {})) episodes += Object.keys(s.episodes || {}).length;
    return { items: t.length, favorites: t.filter((x) => x.favorite).length, watchlist: t.filter((x) => x.watchlist).length, episodes };
  }
  function parseImportText(text) {
    if (typeof text !== 'string' || !text.trim()) return { ok: false, error: 'Le fichier est vide.' };
    if (text.length > 15e6) return { ok: false, error: 'Le fichier est trop volumineux (15 Mo maximum).' };
    let json;
    try { json = JSON.parse(text); } catch (e) { return { ok: false, error: "Le fichier n'est pas un JSON valide (" + e.message + ')' }; }
    return parseImportObject(json);
  }
  function parseImportObject(json) {
    if (!isObj(json)) return { ok: false, error: 'Format non reconnu : le fichier doit contenir un objet JSON.' };
    if (json.app === 'crazy-liste' || isObj(json.tracking)) {
      const v = json.schemaVersion;
      if (Number.isInteger(v) && v > C.SCHEMA_VERSION) return { ok: false, error: 'Cette sauvegarde vient d’une version plus récente de Crazy Liste (schéma ' + v + ').' };
      if (json.kind === 'lists') {
        if (!Array.isArray(json.items)) return { ok: false, error: 'Export favoris/watchlist incomplet : la liste « items » est absente.' };
        const data = emptyData();
        let invalid = 0;
        for (const it of json.items) {
          const pk = isObj(it) ? parseKey(it.key || C.itemKey(it.type, it.id)) : null;

          const t = C.emptyTrack(pk.type, pk.id);
          t.favorite = it.favorite === true;
          t.watchlist = it.watchlist === true;
          t.addedAt = validTime(it.addedAt);
          data.tracking[pk.key] = t;
          data.metadata[pk.key] = sanitizeMeta(pk.key, it) || C.placeholderMeta(pk.key);
        }
        if (!Object.keys(data.tracking).length) return { ok: false, error: 'Aucun favori ni contenu de watchlist valide dans ce fichier.' };

      }
      if (!isObj(json.tracking)) return { ok: false, error: 'Sauvegarde Crazy Liste incomplète : la section « tracking » est absente.' };
      const { data, invalid } = sanitizeData(json);

    }
    if (isObj(json.items)) {
      const res = migrateLegacyCinelog(json);
      if (!res.report.kept) return { ok: false, error: 'Ancienne sauvegarde reconnue, mais elle ne contient aucun suivi, favori ni watchlist à reprendre.' };
      const data = emptyData();
      data.tracking = res.tracking;
      data.metadata = res.metadata;
      return { ok: true, kind: 'legacy', data, invalid: 0, report: res.report, summary: summarize(data) };
    }

      data.tracking = res.tracking;
      data.metadata = res.metadata;

  /* ---------- Export ---------- */
  function buildFullExport(data, nowIso) {
    const prefs = Object.assign({}, data.preferences);
    delete prefs.apiKey; // la clé n'est pas exportée
    return { app: 'crazy-liste', kind: 'full', schemaVersion: C.SCHEMA_VERSION, exportedAt: nowIso, tracking: data.tracking, metadata: data.metadata, preferences: prefs };
  }
  function buildListsExport(data, nowIso) {
    const items = [];
    for (const [k, t] of Object.entries(data.tracking)) {
      if (!t.favorite && !t.watchlist) continue;
      const m = data.metadata[k] || C.placeholderMeta(k);
      items.push({ key: k, type: t.type, id: t.id, favorite: !!t.favorite, watchlist: !!t.watchlist, addedAt: t.addedAt || 0,
        title: m.title, year: m.year, date: m.date, posterPath: m.posterPath, voteAverage: m.voteAverage });
    }
    return { app: 'crazy-liste', kind: 'lists', schemaVersion: C.SCHEMA_VERSION, exportedAt: nowIso, items };
  }

  /* ---------- Synchronisation entre appareils (logique pure, sans réseau) ----------
     Chaque contenu est un document distant { v, at, track, meta } ; « at » date la dernière modification du suivi.
     Pour chaque contenu, la modification la plus récente l'emporte. Une suppression est un document dont track vaut null.
     L'absence d'un document distant n'est jamais interprétée comme une suppression. */
  const SYNC_KEY = 'crazy-liste-sync';
  function canonicalJson(v) {
    if (Array.isArray(v)) return '[' + v.map(canonicalJson).join(',') + ']';
    if (isObj(v)) return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + canonicalJson(v[k])).join(',') + '}';
    return v === undefined ? 'null' : JSON.stringify(v);
  }
  function fingerprint(track) {
    const s = canonicalJson(track || null);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(36) + '.' + s.length;

  function emptySyncState(uid) { return { uid: typeof uid === 'string' && uid ? uid : null, known: {}, dirty: {}, keyAt: 0 }; }
  function sanitizeSyncState(raw) {
    const s = emptySyncState(isObj(raw) ? raw.uid : null);
    if (!s.uid) return s;
    for (const field of ['known', 'dirty']) {
      if (!isObj(raw[field])) continue;
      for (const [k, v] of Object.entries(raw[field])) if (parseKey(k) && isObj(v) && typeof v.h === 'string' && validTime(v.at)) s[field][k] = { h: v.h, at: v.at };
    }
    s.keyAt = validTime(raw.keyAt);
    return s;
  }
  /* Repère les contenus qui diffèrent de la dernière version convenue avec le serveur.
     initial : première connexion de ce compte sur cet appareil → la date d'activité locale sert de date de modification. */
  function markLocalChanges(sync, tracking, now, initial) {
    const keys = new Set([...Object.keys(tracking), ...Object.keys(sync.known), ...Object.keys(sync.dirty)]);
    const changed = [];
    for (const k of keys) {
      const t = tracking[k] || null;
      const h = fingerprint(t);
      const knownH = sync.known[k] ? sync.known[k].h : fingerprint(null);
      if (h === knownH) { delete sync.dirty[k]; continue; }
      if (sync.dirty[k] && sync.dirty[k].h === h) continue;
      const at = initial && t ? Math.max(1, t.lastActivityAt || 0, t.addedAt || 0) : now;
      sync.dirty[k] = { h, at };
      changed.push(k);
    }
    return changed;
  }
  /* Décide quoi faire d'une version distante : 'same' (identique), 'apply' (plus récente) ou 'push' (la version locale gagne). */
  function reconcileRemote(sync, key, remote, localTrack) {
    const rh = fingerprint(remote.track);
    if (rh === fingerprint(localTrack)) { sync.known[key] = { h: rh, at: remote.at }; delete sync.dirty[key]; return 'same'; }
    const d = sync.dirty[key];
    if (d && d.at > remote.at) return 'push';
    if (!d && sync.known[key] && remote.at < sync.known[key].at) return 'push';

  }
  /* Valide un document distant : il passe par les mêmes contrôles qu'un import. null si inutilisable. */
  function parseRemoteDoc(key, raw) {
    const pk = parseKey(key);
    if (!pk || pk.key !== key || !isObj(raw) || !validTime(raw.at)) return null;
    let track = null, meta = null;
    if (raw.track != null) {
      if (typeof raw.track !== 'string') return null;
      try { track = sanitizeTrack(key, JSON.parse(raw.track)); } catch (e) { return null; }
      if (!track) return null;
      if (!C.isPersonal(track)) track = null;
    }
    if (track && typeof raw.meta === 'string') { try { meta = sanitizeMeta(key, JSON.parse(raw.meta)); } catch (e) { meta = null; } }

  }

  root.CrazyData = Object.freeze({
    STORAGE_KEY, LEGACY_KEYS, defaultPreferences, sanitizePreferences, emptyData, sanitizeTrack, sanitizeMeta, sanitizeData,
    migrateLegacyCinelog, migrateCinevault, migrateLegacySources, mergeData, replaceData,
    parseImportText, parseImportObject, buildFullExport, buildListsExport, summarize,

<script id="crazy-app">
/* Crazy Liste — application : état, stockage, TMDB, actions, navigation et rendu.

(function () {
  'use strict';
  const C = window.CrazyCore;
  const D = window.CrazyData;
  const esc = C.escapeHtml;

  /* ===== Configuration TMDB =====
     Aucune clé dans le code (dépôt public) : chacun colle sa clé dans Réglages, et la synchronisation la transmet à ses autres appareils.

  const TMDB_API = 'https://api.themoviedb.org/3';
  const TMDB_IMG = 'https://image.tmdb.org/t/p/';
  const LANGUAGE = 'fr-FR';
  const CACHE_TTL = 30 * 60 * 1000;
  const HOME_SECTIONS = [
    { id: 'trending', title: 'Tendances de la semaine', path: '/trending/all/week', type: null },
    { id: 'popular-movies', title: 'Films populaires', path: '/movie/popular', type: 'movie' },
    { id: 'popular-tv', title: 'Séries / anime populaires', path: '/tv/popular', type: 'tv' },
    { id: 'anime', title: 'Anime populaires', path: '/discover/tv', params: { with_genres: '16', with_original_language: 'ja', sort_by: 'popularity.desc' }, type: 'tv' },
    { id: 'top-movies', title: 'Films les mieux notés', path: '/movie/top_rated', type: 'movie' },
    { id: 'upcoming', title: 'Films à venir', path: '/movie/upcoming', params: { region: 'FR' }, type: 'movie', upcoming: true }

    persistBlocked: false,
    banners: [],
    route: { name: 'home', params: {} },
    ui: {
      home: {},                   // id de section -> { status, items, error }
      search: { q: '', filters: C.parseSearchFilters({}), mode: 'idle', page: 0, totalPages: 0, results: [], hidden: 0, status: 'idle', error: null },
      detail: { key: null, status: 'idle', error: null },
      expanded: {},               // clé -> Set des saisons ouvertes
      seasonLoad: {},             // "clé#n" -> { status, error }
      busy: {}                    // opérations longues en cours
    },
    cache: { summaries: new Map(), details: new Map(), seasons: new Map(), collections: new Map(), sagas: {}, availability: new Map(), agenda: { status: 'idle', loaded: 0, total: 0, failed: 0 }, relations: new Map(), runtimes: { status: 'idle', loaded: 0, total: 0, tried: new Set() } }
  };
  let lastStamp = 0;

  function todayIso() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  /* ===== Bandeaux persistants ===== */

  }

  function renderBanners() {
    byId('banners').innerHTML = state.banners.map((b) => '<div class="banner banner-' + b.tone + '" role="' + (b.tone === 'error' ? 'alert' : 'status') + '"><p>' + esc(b.text) + '</p>' +
      b.actions.map((a) => a.href ? '<a class="btn btn-sm" href="' + esc(a.href) + '">' + esc(a.label) + '</a>'

  /* ===== Chargement, migration, sauvegarde ===== */

    } else {
      state.persistBlocked = true;
      addBanner('corrupt', 'error', 'La sauvegarde est illisible et aucune copie n’a pu être faite : rien ne sera enregistré pour ne pas l’écraser.', [{ label: 'Repartir de zéro', action: 'unblock-storage' }]);
    }

  }
  function migrateFromLegacy() {
    const sources = [];
    for (const key of D.LEGACY_KEYS) {
      const text = storage.get(key);

    }

    const { data, reports } = D.migrateLegacySources(sources);
    const kept = Object.keys(data.tracking).length;
    if (!kept) return D.emptyData();
    const backup = JSON.stringify({ createdAt: new Date().toISOString(), sources: Object.fromEntries(sources.map((s) => [s.key, s.text])) });
    const saved = storage.set('crazy-liste-backup-legacy', backup).ok && storage.set(D.STORAGE_KEY, JSON.stringify(data)).ok;
    const ignored = reports.reduce((n, r) => n + r.ignored, 0);
    addBanner('migrated', 'info', 'Ancienne sauvegarde reprise : ' + kept + ' contenu(s) suivi(s), favori(s) ou en watchlist' +
      (ignored ? ' (' + ignored + ' simple(s) consultation(s) non reprise(s))' : '') + '. Les anciennes données restent intactes' +
      (saved ? ', avec une copie de secours.' : ' ; la nouvelle sauvegarde n’a pas pu être écrite.'));
    return data;
  }
  function persist() {
    if (state.persistBlocked) return false;
    const res = storage.set(D.STORAGE_KEY, JSON.stringify(state.data));
    noteLocalChanges();
    if (res.ok) { removeBanner('persist'); return true; }
    if (res.error !== 'unavailable') {
      addBanner('persist', 'error', res.error === 'quota'
        ? 'Sauvegarde impossible : le stockage du navigateur est plein. Exporte ta sauvegarde depuis Réglages.'
        : 'Sauvegarde impossible pour le moment : tes derniers changements ne sont pas enregistrés.');
    }

  }

  /* ===== Synchronisation Firebase =====
     Toujours facultative : sans connexion, l'application fonctionne exactement comme avant.
     Les données locales restent la source affichée ; le serveur ne fait que transporter les modifications. */
  const sync = {
    status: FIREBASE_CONFIG ? 'loading' : 'off', // off | file | loading | signedout | signing | syncing | pending | ok | error
    error: '', user: null,
    state: D.emptySyncState(null),
    fb: null, unsubs: [], timer: 0, pushing: false, pendingTimer: 0
  };
  function loadSyncState() {
    const raw = storage.get(D.SYNC_KEY);
    if (raw == null) return D.emptySyncState(null);
    try { return D.sanitizeSyncState(JSON.parse(raw)); } catch (e) { return D.emptySyncState(null); }
  }
  function saveSyncState() { storage.set(D.SYNC_KEY, JSON.stringify(sync.state)); }
  function setSyncStatus(status, error) {
    sync.status = status;
    sync.error = error || '';
    renderSyncChip();
    if (state.renderedView === 'home' && !tmdbReady()) byId('view-root').innerHTML = welcomeHtml();
    if (state.renderedView === 'settings') byId('sync-panel').innerHTML = syncPanelInner();
  }
  const SYNC_ERRORS = {
    'auth/unauthorized-domain': 'Cette adresse n’est pas autorisée dans Firebase (Authentication › Paramètres › Domaines autorisés).',
    'auth/network-request-failed': 'Connexion impossible : vérifie ta connexion Internet.',
    'auth/operation-not-allowed': 'La connexion Google n’est pas activée dans Firebase (Authentication › Méthode de connexion).',
    'permission-denied': 'Accès refusé par les règles Firestore : ce compte n’est pas autorisé à synchroniser cette liste.',
    'unavailable': 'Serveur de synchronisation injoignable : les changements partiront au retour de la connexion.'
  };
  function syncErrorText(err) { return SYNC_ERRORS[err && err.code] || 'Synchronisation impossible' + (err && err.code ? ' (' + err.code + ')' : '') + '.'; }

  async function initSync() {
    sync.state = loadSyncState();
    if (!FIREBASE_CONFIG) { setSyncStatus('off'); return; }
    if (!/^https?:$/.test(location.protocol)) { setSyncStatus('file'); return; }
    setSyncStatus('loading');
    try {
      const [app, auth, fs] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map((f) => import(FIREBASE_SDK + f)));

  function stopListeners() { sync.unsubs.forEach((u) => u()); sync.unsubs = []; }

  /* Réception : chaque document distant est validé puis comparé à la version locale. */
  function onRemoteItems(snap) {

      const key = docSnap.id;
      const remote = D.parseRemoteDoc(key, docSnap.data());
      if (!remote) continue;
      const local = getTrack(key);
      const decision = D.reconcileRemote(sync.state, key, remote, local);
      if (decision === 'apply') {

          state.data.tracking[key] = remote.track;

  }

  /* Envoi : appelé après chaque sauvegarde locale ; regroupe les modifications rapprochées. */

  async function pushDirty() {

    sync.pendingTimer = setTimeout(() => { if (sync.pushing) setSyncStatus('pending'); }, 4000); // hors ligne : Firestore garde l'envoi en file
    const { fs, db } = sync.fb;

    try {
      for (let i = 0; i < keys.length; i += 400) {
        const batch = fs.writeBatch(db);
        const sent = [];
        for (const k of keys.slice(i, i + 400)) {
          const track = getTrack(k);
          const at = sync.state.dirty[k] ? sync.state.dirty[k].at : Date.now();
          batch.set(fs.doc(db, 'users', uid, 'items', k), D.buildRemoteDoc(track, state.data.metadata[k], at));
          sent.push([k, D.fingerprint(track), at]);
        }
        await batch.commit();
        if (!sync.user || sync.user.uid !== uid) return;
        sent.forEach(([k, h, at]) => D.confirmPush(sync.state, k, h, at));
        saveSyncState();
      }
      sync.pushing = false;
      if (Object.keys(sync.state.dirty).length) schedulePush(300); else setSyncStatus('ok');
    } catch (err) {

  }
  async function signIn() {

    setSyncStatus('signing');
    try {
      await auth.signInWithPopup(a, new auth.GoogleAuthProvider());
    } catch (err) {
      if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) { setSyncStatus(sync.user ? 'ok' : 'signedout'); return; }
      if (err && (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment')) { await auth.signInWithRedirect(a, new auth.GoogleAuthProvider()); return; }
      setSyncStatus('error', syncErrorText(err));
    }
  }
  async function signOutSync() {
    if (!sync.fb) return;

    sync.state = D.emptySyncState(null);
    saveSyncState();
    await sync.fb.auth.signOut(sync.fb.a);

  }
  function syncSummary() {
    switch (sync.status) {
      case 'off': return { tone: 'muted', short: '', text: 'Synchronisation non configurée dans cette version : ta liste reste dans ce navigateur.' };
      case 'file': return { tone: 'muted', short: '', text: 'Ouverte depuis un fichier, l’application ne peut pas se connecter. Ouvre-la depuis son adresse web pour synchroniser.' };
      case 'loading': return { tone: 'muted', short: 'Synchro…', text: 'Chargement de la synchronisation…' };
      case 'signedout': return { tone: 'muted', short: 'Synchro désactivée', text: 'Non connecté : ta liste reste uniquement sur cet appareil.' };
      case 'signing': return { tone: 'muted', short: 'Connexion…', text: 'Connexion à Google en cours (une fenêtre Google s’ouvre)…' };
      case 'syncing': return { tone: 'muted', short: 'Synchronisation…', text: 'Synchronisation en cours…' };
      case 'pending': return { tone: 'warn', short: 'Envoi en attente', text: 'Envoi en attente : les changements partiront dès que la connexion reviendra.' };

  function renderSyncChip() {

  function syncPanelInner() {

    if (sync.user) {
      html += '<p>Connecté avec <strong>' + esc(sync.user.email || sync.user.name || 'ton compte Google') + '</strong>.</p>' +
        '<div class="row"><button type="button" class="btn" data-action="sync-now">Synchroniser maintenant</button><button type="button" class="btn btn-ghost" data-action="sync-signout">Se déconnecter</button></div>';
    } else if (sync.fb) {

  /* ===== Client TMDB ===== */
  const TMDB_MESSAGES = {
    nokey: 'Aucune clé TMDB configurée : ajoute ta clé dans Réglages.',
    login: 'Connecte-toi avec Google (Réglages) pour charger les films et séries.',
    relayauth: 'Connexion Google expirée ou refusée par le relais : reconnecte-toi dans Réglages.',
    relaydenied: 'Ce compte Google n’est pas autorisé à utiliser le relais Crazy Liste.',
    relaykey: 'Le relais Crazy Liste n’a pas de clé TMDB valide : elle est à corriger dans Cloudflare.',
    auth: 'Clé TMDB refusée (401) : vérifie-la dans Réglages.',
    notfound: 'Contenu introuvable sur TMDB.',
    rate: 'TMDB reçoit trop de requêtes : réessaie dans un instant.',
    server: 'TMDB rencontre un problème (erreur serveur) : réessaie plus tard.',
    network: 'Connexion à TMDB impossible : vérifie ta connexion Internet.',
    invalid: 'Réponse TMDB inattendue.',
    unknown: 'Erreur TMDB inattendue.'
  };
  class TmdbError extends Error {
    constructor(kind, status) { super(TMDB_MESSAGES[kind] || TMDB_MESSAGES.unknown); this.name = 'TmdbError'; this.kind = kind; this.status = status || 0; }
  }
  const requestCache = new Map();
  function currentKey() { return (state.data.preferences.apiKey || '').trim() || DEFAULT_TMDB_KEY; }
  /* Sans clé : passage par le relais si la personne est connectée avec Google. */
  const useRelay = () => !currentKey() && !!TMDB_RELAY && !!sync.user;
  function tmdbReady() { return !!currentKey() || useRelay(); }
  function relayToken() {
    const u = sync.fbUser;
    if (!u || typeof u.getIdToken !== 'function') return Promise.reject(new TmdbError('login'));
    return Promise.resolve(u.getIdToken()).catch(() => { throw new TmdbError('relayauth'); });
  }
  function tmdb(path, params, opts) {
    const o = opts || {};
    const key = o.key || currentKey();
    const relay = !key && useRelay();
    if (!key && !relay) return Promise.reject(new TmdbError(TMDB_RELAY ? 'login' : 'nokey'));
    const url = new URL((relay ? TMDB_RELAY.replace(/\/+$/, '') : TMDB_API) + path);
    url.searchParams.set('language', LANGUAGE);
    for (const [k, v] of Object.entries(params || {})) if (v != null && v !== '') url.searchParams.set(k, String(v));
    const cacheKey = url.toString() + '|' + (relay ? 'relais' : key);
    if (!o.noCache) {
      const hit = requestCache.get(cacheKey);
      if (hit && Date.now() - hit.at < CACHE_TTL) return hit.promise;
    }
    const headers = { accept: 'application/json' };
    if (relay) { /* le ticket Google est ajouté juste avant l'envoi */ } else if (/^eyJ/.test(key)) headers.Authorization = 'Bearer ' + key; else url.searchParams.set('api_key', key);
    const send = relay ? relayToken().then((t) => fetch(url.toString(), { headers: Object.assign({}, headers, { Authorization: 'Bearer ' + t }), signal: o.signal }))

      .then((res) => {

        if (!res.ok) throw new TmdbError(res.status === 401 ? 'auth' : res.status === 404 ? 'notfound' : res.status === 429 ? 'rate' : res.status >= 500 ? 'server' : 'unknown', res.status);

      });

  function img(path, size) { return path ? TMDB_IMG + size + path : null; }
  const noop = () => {};

  /* ===== Accès aux données ===== */
  const getTrack = (key) => state.data.tracking[key] || null;
  function rememberSummary(s) { if (s && !state.cache.summaries.has(s.key)) state.cache.summaries.set(s.key, s); }
  /* Meilleures métadonnées disponibles : fiche chargée > métadonnées sauvegardées > résumé affiché. Ne modifie rien. */
  function buildMeta(key, prev) {
    const d = state.cache.details.get(key);
    const s = state.cache.summaries.get(key);
    let m = d ? C.metaFromDetail(d, prev) : prev ? prev : s ? C.metaFromSummary(s, null) : C.placeholderMeta(key);
    if (m && m.type === 'tv' && Array.isArray(m.seasonSummaries)) {
      for (const sum of m.seasonSummaries) {
        const season = state.cache.seasons.get(key + '#' + sum.number);
        if (season) m = C.withSeasonEpisodes(m, season);
      }
    }
    return m;
  }
  function viewMeta(key) { return state.data.metadata[key] || buildMeta(key, null); }
  function itemState(key) { const pk = C.parseKey(key); return C.computeItemState(pk.type, viewMeta(key), getTrack(key)); }
  function itemTitle(key) { return viewMeta(key).title; }

  /* ===== Cycle d'action centralisé ===== */
  function commit(key, change, opts) {
    const o = opts || {};
    const pk = C.parseKey(key);
    const before = { track: getTrack(key), meta: state.data.metadata[key] || null };
    let next;
    try { next = change(before.track || C.emptyTrack(pk.type, pk.id)); } catch (err) { console.error(err); toast('Action impossible : ' + err.message, 'error'); return false; }
    if (C.isPersonal(next)) {                                     // 1. état
      const meta = buildMeta(key, before.meta);
      const was = before.track ? C.computeItemState(pk.type, before.meta || meta, before.track).status : 'todo';
      state.data.tracking[key] = C.stampSeen(next, was, C.computeItemState(pk.type, meta, next).status, Date.now());
      state.data.metadata[key] = meta;
    } else {
      delete state.data.tracking[key];
      delete state.data.metadata[key];
    }
    refreshItem(key);                                             // 2-3. agrégats + interface

    refreshItem(key);
    persist();
  }
  function refreshItem(key) {
    patchItemUI(key);
