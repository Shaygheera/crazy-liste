    renderChrome();
  }

  /* ===== Chargements réseau ===== */
  async function loadHomeSection(sec, force) {
    const cur = state.ui.home[sec.id];
    if (!force && cur && (cur.status === 'ready' || cur.status === 'loading' || cur.status === 'empty')) return;
    state.ui.home[sec.id] = { status: 'loading' };
    renderHomeSection(sec.id);
    try {
      const json = await tmdb(sec.path, sec.params);
      let items = (Array.isArray(json.results) ? json.results : []).map((r) => C.normalizeSummary(r, sec.type)).filter(Boolean);
      if (sec.upcoming) items = C.filterUpcoming(items, todayIso());
      items.forEach(rememberSummary);
      state.ui.home[sec.id] = { status: items.length ? 'ready' : 'empty', items: items.slice(0, 20) };
    } catch (err) {
      state.ui.home[sec.id] = { status: 'error', error: err };
    }
    renderHomeSection(sec.id);
  }

  let searchSeq = 0, searchAbort = null, searchTimer = 0;
  function searchHash(q, f) { return C.buildHash('search', Object.assign({ q }, C.filtersToParams(f))); }
  function startSearch(q, filters, page) {
    const s = state.ui.search;
    const p = page || 1;
    if (searchAbort) searchAbort.abort();
    const seq = ++searchSeq;
    s.q = q; s.filters = filters;
    s.mode = q ? 'text' : C.hasRefinement(filters) ? 'discover' : 'idle';
    if (s.mode === 'idle') { Object.assign(s, { status: 'idle', results: [], page: 0, totalPages: 0, hidden: 0, error: null }); renderSearchBody(); return; }
    s.error = null;
    s.status = p === 1 ? 'loading' : 'loading-more';
    if (p === 1) { s.results = []; s.hidden = 0; }
    renderSearchBody();
    const ctrl = new AbortController();
    searchAbort = ctrl;
    (s.mode === 'text' ? textSearch(q, filters, p, ctrl.signal) : discoverSearch(filters, p, ctrl.signal)).then((res) => {
      if (seq !== searchSeq) return; // réponse périmée : une recherche plus récente a été lancée
      res.items.forEach(rememberSummary);
      let merged = p === 1 ? res.items : s.results.concat(res.items.filter((i) => !s.results.some((r) => r.key === i.key)));
      if (s.mode === 'text' && filters.sort) merged = C.sortResults(merged, filters.sort);
      Object.assign(s, { results: merged, page: p, totalPages: res.totalPages, hidden: s.hidden + (res.hidden || 0) });
      s.status = merged.length ? 'ready' : p < res.totalPages ? 'ready' : 'empty';
      renderSearchBody();
    }).catch((err) => {
      if (seq !== searchSeq || (err && err.name === 'AbortError')) return;
      Object.assign(s, { status: p === 1 ? 'error' : 'ready', error: err });
      renderSearchBody();
      if (p > 1) toast(err.message, 'error');
    });
  }
  async function discoverSearch(f, p, signal) {
    const s = state.ui.search;
    const needsVotes = f.sort === 'rating' || !!f.rating;
    let level = p === 1 ? 0 : s.voteLevel || 0;
    let reqs, answers;
    for (;;) {
      reqs = C.discoverRequests(f, p, todayIso(), level, onlyAvailable());
      answers = await Promise.all(reqs.map((r) => tmdb(r.path, r.params, { signal, noCache: true })));
      const total = answers.reduce((n, j) => n + C.num(j.total_results), 0);
      if (p > 1 || !needsVotes || total >= 10 || level >= 2) break;
      level++; // trop peu de titres assez votés (période récente) : seuil assoupli
    }
    s.voteLevel = level;
    const lists = answers.map((json, i) => (Array.isArray(json.results) ? json.results : []).map((x) => C.normalizeSummary(x, reqs[i].type)).filter(Boolean));
    const totalPages = Math.min(500, Math.max(0, ...answers.map((j) => C.num(j.total_pages))));
    let items = C.mergeResults(lists, f.sort);
    if (C.NEEDS_DETAIL_STATUSES.includes(f.status)) {
      const statuses = await seriesInfo(items, f, signal);
      const kept = items.filter((i) => C.matchesFilters(i, f, statuses[i.key], state.today));
      return { items: kept, totalPages, hidden: items.length - kept.length };
    }
    return { items, totalPages };
  }
  async function textSearch(q, f, p, signal) {
    const path = f.type === 'movie' ? '/search/movie' : f.type === 'tv' || f.type === 'anime' ? '/search/tv' : '/search/multi';
    const json = await tmdb(path, { query: q, page: p, include_adult: 'false' }, { signal, noCache: true });
    const fallback = f.type === 'movie' ? 'movie' : f.type === 'all' ? null : 'tv';
    const all = (Array.isArray(json.results) ? json.results : []).map((r) => C.normalizeSummary(r, fallback)).filter(Boolean);
    const statuses = f.status !== 'any' ? await seriesInfo(all, f, signal) : {};
    const items = all.filter((i) => C.matchesFilters(i, f, statuses[i.key], state.today));
    return { items, totalPages: C.num(json.total_pages), hidden: all.length - items.length };
  }
  /* Le statut de diffusion et les saisons annoncées ne sont que dans la fiche : chargée (4 à la fois, en cache) pour les séries qui passent les autres filtres. */
  async function seriesInfo(items, f, signal) {
    const statuses = {};
    const loose = Object.assign({}, f, { status: 'any' });
    const todo = items.filter((i) => i.type === 'tv' && C.matchesFilters(i, loose));
    let next = 0;
    const worker = async () => {
      while (next < todo.length) {
        const it = todo[next++];
        let d = state.cache.details.get(it.key);
        if (!d) {
          try { d = C.normalizeDetail(await tmdb('/tv/' + it.id, DETAIL_PARAMS, { signal }), 'tv'); } catch (err) { if (err && err.name === 'AbortError') throw err; d = null; }
          if (d) state.cache.details.set(it.key, d);
        }
        if (d) statuses[it.key] = { status: d.productionStatus, nextEpisode: d.nextEpisode, seasons: d.seasonSummaries };
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    return statuses;
  }

  /* Suite et licence d'une série : Wikidata (suite confirmée) et recherche TMDB par début de titre, en parallèle.
     Échecs silencieux : la colonne « Suite » et la ligne « Licence » n'apparaissent simplement pas. */
  const WIKIDATA_SPARQL = 'https://query.wikidata.org/sparql';
  async function summaryOf(key) {
    if (state.cache.summaries.has(key)) return state.cache.summaries.get(key);
    const pk = C.parseKey(key);
    const s = C.normalizeSummary(Object.assign({}, await tmdb('/' + pk.type + '/' + pk.id, {}), { media_type: pk.type }), pk.type);
    if (s) state.cache.summaries.set(key, s);
    return s;
  }
  async function loadRelations(key) {
    if (state.cache.relations.has(key)) return;
    const d = state.cache.details.get(key);
    if (!d || d.type !== 'tv') return;
    const rel = { status: 'loading', base: C.licenceBase(d.title) || C.licenceBase(d.originalTitle), list: [], next: null, confirmed: false };
    state.cache.relations.set(key, rel);
    const wiki = fetch(WIKIDATA_SPARQL + '?format=json&query=' + encodeURIComponent(C.wikidataQuery(d.id)), { headers: { Accept: 'application/sparql-results+json' } })
      .then((r) => (r.ok ? r.json() : null)).then((j) => C.parseWikidataRelations(j)).catch(() => ({ next: [], prev: [] }));
    const search = rel.base ? tmdb('/search/multi', { query: rel.base, include_adult: 'false' })
      .then((j) => (Array.isArray(j.results) ? j.results : []).map((x) => C.normalizeSummary(x, null)).filter(Boolean)).catch(() => []) : Promise.resolve([]);
    const [w, found] = await Promise.all([wiki, search]);
    found.forEach(rememberSummary);
    const linked = (await Promise.all(w.next.concat(w.prev).slice(0, 6).map((k) => summaryOf(k).catch(() => null)))).filter(Boolean);
    const current = state.cache.summaries.get(key) || d;
    const list = C.licenceList(current, found, rel.base, 10);
    for (const x of linked) if (!list.some((y) => y.key === x.key)) list.push(x); // titres liés par Wikidata même si leur titre diffère
    list.sort((a, b) => ((a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0));
    const confirmedNext = w.next.map((k) => linked.find((x) => x.key === k)).find(Boolean) || null;
    Object.assign(rel, { status: 'ready', list: list.length > 1 ? list : [], next: confirmedNext || C.probableNext(list, current), confirmed: !!confirmedNext });
    if (state.route.name === 'detail' && state.route.key === key) renderRelated();
  }

  /* Fiche complète chargée hors de la page Fiche (calendrier, durées) : mise en cache, métadonnées enregistrées mises à jour. */
  async function fetchDetail(key) {
    const pk = C.parseKey(key);
    const d = C.normalizeDetail(await tmdb('/' + pk.type + '/' + pk.id, DETAIL_PARAMS), pk.type);
    if (!d) throw new TmdbError('invalid');
    state.cache.details.set(key, d);
    rememberSummary(d);
    if (C.isPersonal(getTrack(key))) state.data.metadata[key] = buildMeta(key, state.data.metadata[key] || null);
    return d;
  }
  async function runPool(keys, size, onEach) {
    let next = 0;
    const worker = async () => { while (next < keys.length) { const k = keys[next++]; let ok = true; try { await fetchDetail(k); } catch (err) { ok = false; } onEach(k, ok); } };
    await Promise.all(Array.from({ length: Math.min(size, keys.length) }, worker));
  }
  /* Calendrier : fiches des séries de ma liste et des films pas encore sortis (6 à la fois). */
  async function loadAgenda(force) {
    const st = state.cache.agenda;
    if (st.status === 'loading' || !tmdbReady()) return;
    const today = state.today;
    const keys = C.personalEntries(state.data)
      .filter((e) => e.type === 'tv' || (e.status !== 'seen' && (!e.meta.date || e.meta.date >= today)))
      .map((e) => e.key).filter((k) => force || !state.cache.details.has(k));
    Object.assign(st, { status: 'loading', loaded: 0, total: keys.length, failed: 0 });
    if (state.renderedView === 'agenda') renderAgendaBody();
    await runPool(keys, 6, (k, ok) => { st.loaded++; if (!ok) st.failed++; if (st.loaded % 6 === 0) renderAgendaProgress(); });
    st.status = 'ready';
    if (keys.length) persist();
    if (state.renderedView === 'agenda') renderAgendaBody();
  }
  /* Statistiques : durée manquante (anciennes données) récupérée une fois par session, 4 fiches à la fois. */
  async function fillRuntimes() {
    const st = state.cache.runtimes;
    if (st.status === 'loading' || !tmdbReady()) return;
    const keys = C.personalEntries(state.data)
      .filter((e) => !e.meta.runtime && !st.tried.has(e.key) && (e.type === 'movie' ? e.status === 'seen' : e.state.seenEpisodes > 0))
      .map((e) => e.key);
    if (!keys.length) return;
    keys.forEach((k) => st.tried.add(k));
    Object.assign(st, { status: 'loading', loaded: 0, total: keys.length });
    if (state.renderedView === 'stats') renderView();
    await runPool(keys, 4, () => { st.loaded++; const el = document.getElementById('runtime-progress'); if (el) el.textContent = runtimeProgressText(); });
    st.status = 'ready';
    persist();
    if (state.renderedView === 'stats') renderView();
  }

  /* Sagas : un résumé TMDB par titre (6 requêtes à la fois, mises en cache). Les échecs sont comptés, pas bloquants. */
  async function loadSaga(saga, withOptional) {
    const keys = C.sagaKeys(saga, withOptional);
    const st = state.cache.sagas[saga.id] || (state.cache.sagas[saga.id] = { status: 'idle', failed: [], loaded: 0, total: 0, key: '' });
    const todo = keys.filter((k) => !state.cache.summaries.has(k));
    const sig = keys.join(',');
    if (st.status === 'loading' && st.key === sig) return;
    if (!todo.length) { Object.assign(st, { status: 'ready', key: sig, total: keys.length, loaded: keys.length }); renderSagaBody(saga.id); return; }
    Object.assign(st, { status: 'loading', key: sig, failed: [], total: keys.length, loaded: keys.length - todo.length });
    renderSagaBody(saga.id);
    let next = 0;
    const worker = async () => {
      while (next < todo.length) {
        const k = todo[next++];
        const pk = C.parseKey(k);
        try {
          const raw = await tmdb('/' + pk.type + '/' + pk.id, {});
          const sum = C.normalizeSummary(Object.assign({}, raw, { media_type: pk.type }), pk.type);
          if (sum) state.cache.summaries.set(k, sum); else st.failed.push(k);
        } catch (err) { st.failed.push(k); }
        st.loaded++;
        if (st.loaded % 8 === 0) renderSagaProgress(saga.id);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
    st.status = 'ready';
    renderSagaBody(saga.id);
  }

  /* Disponibilité : les films sortis depuis moins de 9 mois sont vérifiés auprès de TMDB (dates de sortie vidéo), 4 à la fois. */
  function availability(item) {
    if (!item) return 'unknown';
    const cached = state.cache.availability.get(item.key);
    return cached || C.availabilityOf(item, state.today);
  }
  const onlyAvailable = () => state.data.preferences.onlyAvailable === true;
  function filterAvailable(items) { return onlyAvailable() ? items.filter((it) => C.isAvailable(availability(it))) : items; }
  const availQueue = new Set();
  let availRunning = 0;
  function checkAvailability() { // appelée après chaque rendu : repère les miniatures encore à vérifier
    document.querySelectorAll('[data-avail="unknown"]').forEach((el) => {
      const k = el.dataset.availFor;
      if (!state.cache.availability.has(k)) availQueue.add(k);
    });
    while (availRunning < 4 && availQueue.size) {
      const k = availQueue.values().next().value;
      availQueue.delete(k);
      const pk = C.parseKey(k);
      if (!pk || pk.type !== 'movie') continue;
      availRunning++;
      state.cache.availability.set(k, 'unknown'); // évite un second envoi pendant la requête
      tmdb('/movie/' + pk.id + '/release_dates', {}).then((json) => {
        const item = state.cache.summaries.get(k) || state.data.metadata[k] || state.cache.details.get(k);
        state.cache.availability.set(k, C.availabilityOf(item, state.today, json));
      }).catch(() => { state.cache.availability.set(k, 'released'); }).finally(() => {
        availRunning--;
        availabilityChanged(k);
        checkAvailability();
      });
    }
  }
  let availRerender = 0;
  function availabilityChanged(k) {
    const st = state.cache.availability.get(k) || 'unknown';
    document.querySelectorAll('[data-avail-for="' + k + '"]').forEach((el) => { el.outerHTML = availHtml(st, k, el.dataset.availDate || ''); });
    if (onlyAvailable() && !C.isAvailable(st)) { clearTimeout(availRerender); availRerender = setTimeout(rerenderListsForAvailability, 120); }
  }
  function rerenderListsForAvailability() {
    if (state.renderedView === 'home') HOME_SECTIONS.forEach((sec) => renderHomeSection(sec.id));
    else if (state.renderedView === 'search') renderSearchBody();
    else if (state.renderedView === 'saga') renderSagaBody(state.route.sagaId);
  }
  function setOnlyAvailable(on) {
    state.data.preferences.onlyAvailable = on;
    persist();
    if (state.route.name === 'search' && state.ui.search.mode === 'discover') startSearch(state.ui.search.q, state.ui.search.filters, 1);
    renderView();
  }

  let detailToken = 0;
  async function loadDetail(route, force) {
    const key = route.key;
    const token = ++detailToken;
    if (!force && state.cache.details.has(key)) {
      state.ui.detail = { key, status: 'ready', error: null };
      afterDetailReady(key);
      return;
    }
    state.ui.detail = { key, status: 'loading', error: null };
    if (force) renderView();
    try {
      const raw = await tmdb('/' + route.type + '/' + route.id, DETAIL_PARAMS);
      const d = C.normalizeDetail(raw, route.type);
      if (!d) throw new TmdbError('invalid');
      state.cache.details.set(key, d);
      rememberSummary(d);
      d.recommendations.forEach(rememberSummary);
      if (C.isPersonal(getTrack(key))) { state.data.metadata[key] = buildMeta(key, state.data.metadata[key] || null); persist(); }
      if (token !== detailToken) return;
      state.ui.detail = { key, status: 'ready', error: null };
      if (d.type === 'tv') expandedSeasons(key);
      renderView();
      renderRelated();
      renderChrome();
      afterDetailReady(key);
    } catch (err) {
      if (token !== detailToken) return;
      state.ui.detail = { key, status: 'error', error: err };
      renderView();
      renderRelated();
    }
  }
  function afterDetailReady(key) {
    const d = state.cache.details.get(key);
    if (d.type === 'tv') {
      for (const n of expandedSeasons(key)) ensureSeason(key, n).catch(noop);
      const ns = d.nextEpisode && d.seasonSummaries.some((x) => x.number === d.nextEpisode.season) ? d.nextEpisode.season : null; // saison parfois pas encore listée par TMDB
      if (ns != null) ensureSeason(key, ns).then(() => refreshAiringInfo(key), noop); // dernier épisode prévu de la saison en cours
      loadRelations(key);
    }
    else if (d.collection) ensureCollection(d.collection.id);
  }
  /* Saisons ouvertes : choix de l'utilisateur, sinon la première saison régulière non terminée. */
  function expandedSeasons(key) {
    if (state.ui.expanded[key]) return state.ui.expanded[key];
    const meta = viewMeta(key);
    const st = C.computeShowState(meta, getTrack(key));
    const first = st.seasons.find((s) => s.status !== 'seen') || st.seasons[st.seasons.length - 1];
    state.ui.expanded[key] = new Set(first ? [first.number] : []);
    return state.ui.expanded[key];
  }
  const seasonPromises = new Map();
  function ensureSeason(key, n) {
    const id = key + '#' + n;
    if (state.cache.seasons.has(id)) return Promise.resolve(state.cache.seasons.get(id));
    if (seasonPromises.has(id)) return seasonPromises.get(id);
    const pk = C.parseKey(key);
    state.ui.seasonLoad[id] = { status: 'loading' };
    patchSeason(key, n);
    const p = tmdb('/tv/' + pk.id + '/season/' + n).then((raw) => {
      const season = C.normalizeSeason(raw);
      if (!season || season.number !== n) throw new TmdbError('invalid');
      state.cache.seasons.set(id, season);
      delete state.ui.seasonLoad[id];
      const m = state.data.metadata[key];
      if (m) {
        const updated = C.withSeasonEpisodes(m, season);
        const before = (m.seasonSummaries || []).find((x) => x.number === n);
        if (!before || JSON.stringify(before.episodeNumbers) !== JSON.stringify(season.episodes.map((e) => e.number))) { state.data.metadata[key] = updated; persist(); renderChrome(); }
      }
      patchSeason(key, n);
      patchTrackBox(key);
      refreshAiringInfo(key);
      return season;
    }, (err) => {
      state.ui.seasonLoad[id] = { status: 'error', error: err };
      patchSeason(key, n);
      throw err;
    }).finally(() => seasonPromises.delete(id));
    seasonPromises.set(id, p);
    return p;
  }
  function ensureCollection(id) {
    const cur = state.cache.collections.get(id);
    if (cur && cur.status !== 'error') return;
    state.cache.collections.set(id, { status: 'loading' });
    tmdb('/collection/' + id).then((json) => {
      const parts = Array.isArray(json.parts) ? json.parts : [];
      parts.forEach((p) => rememberSummary(C.normalizeSummary(p, 'movie')));
      state.cache.collections.set(id, { status: 'ready', parts, name: C.str(json.name, 200) });
    }, (err) => {
      state.cache.collections.set(id, { status: 'error', error: err });
    }).then(renderRelated);
  }
  /* Complète les métadonnées des contenus suivis qui en manquent (anciennes sauvegardes, imports). Ne touche pas au suivi. */
  async function refreshStaleMetadata() {
    const keys = Object.keys(state.data.tracking).filter((k) => {
      const m = state.data.metadata[k];
      return !m || m.placeholder || (m.type === 'tv' && !Array.isArray(m.seasonSummaries));
    });
    if (!keys.length) return;
    let i = 0, changed = false;
    async function worker() {
      while (i < keys.length) {
        const k = keys[i++];
        const pk = C.parseKey(k);
        try {
          const raw = await tmdb('/' + pk.type + '/' + pk.id, DETAIL_PARAMS);
          const d = C.normalizeDetail(raw, pk.type);
          if (!d) continue;
          state.cache.details.set(k, d);
          if (state.data.tracking[k]) { state.data.metadata[k] = buildMeta(k, state.data.metadata[k] || null); changed = true; }
        } catch (e) { /* hors ligne ou contenu retiré : nouvel essai au prochain démarrage */ }
      }
    }
    await Promise.all([worker(), worker()]);
    if (!changed) return;
    persist();
    renderChrome();
    if (LIST_ROUTES.includes(state.route.name)) renderView();
    else Object.keys(state.data.tracking).forEach(patchItemUI);
  }
  /* Charge toutes les saisons régulières (4 en parallèle) ; renvoie les listes d'épisodes et les échecs. */
  async function loadRegularSeasons(key, onProgress) {
    const d = state.cache.details.get(key);
    const regular = d.seasonSummaries.filter((s) => s.number > 0);
    const map = {}, failed = [];
    let i = 0, done = 0;
    async function worker() {
      while (i < regular.length) {
        const s = regular[i++];
        try { const season = await ensureSeason(key, s.number); if (season.episodes.length) map[s.number] = season.episodes.map((e) => e.number); }
        catch (e) { failed.push(s.number); }
        onProgress(++done, regular.length);
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    return { map, failed: failed.sort((a, b) => a - b) };
  }

  /* ===== Actions utilisateur (délégation d'événements, aucun onclick inline) ===== */
  function seasonFromCache(key, n) { return state.cache.seasons.get(key + '#' + n) || null; }
  function setBusy(id, on) { if (on) state.ui.busy[id] = true; else delete state.ui.busy[id]; }
  async function seasonForAction(el, key, n) {
    const cached = seasonFromCache(key, n);
    if (cached) return cached;
    el.classList.add('is-busy');
    try { return await ensureSeason(key, n); }
    catch (err) { toast('Saison ' + n + ' : ' + err.message + ' Rien n’a été modifié.', 'error'); return null; }
    finally { el.classList.remove('is-busy'); }
  }
  const actions = {
    'toggle-favorite'(el) {
      const key = el.dataset.key;
      const wasOn = !!(getTrack(key) && getTrack(key).favorite);
      commit(key, (t) => C.toggleFlag(t, 'favorite', Date.now()), wasOn ? { undo: '« ' + itemTitle(key) + ' » retiré des favoris.' } : null);
    },
    'toggle-watchlist'(el) {
      const key = el.dataset.key;
      const wasOn = !!(getTrack(key) && getTrack(key).watchlist);
      commit(key, (t) => C.toggleFlag(t, 'watchlist', Date.now()), wasOn ? { undo: '« ' + itemTitle(key) + ' » retiré de la watchlist.' } : null);
    },
    'movie-status'(el) { commit(el.dataset.key, (t) => C.setMovieStatus(t, el.dataset.status, activityStamp())); },
    'episode-status'(el) {
      const n = Number(el.dataset.season), e = Number(el.dataset.episode);
      commit(el.dataset.key, (t) => C.setEpisodeStatus(t, n, e, el.dataset.status, activityStamp()));
    },
    async 'episodes-upto'(el) {
      const key = el.dataset.key, n = Number(el.dataset.season), e = Number(el.dataset.episode);
      const season = seasonFromCache(key, n);
      if (!season) return;
      const nums = season.episodes.map((x) => x.number);
      commit(key, (t) => C.setEpisodesUpTo(t, n, nums, e, activityStamp()), { undo: 'Saison ' + n + ' : épisodes jusqu’à É' + e + ' marqués « Vu ».' });
    },
    async 'season-status'(el) {
      const key = el.dataset.key, n = Number(el.dataset.season), status = el.dataset.status;
      const season = await seasonForAction(el, key, n);
      if (!season) return;
      const nums = season.episodes.map((x) => x.number);
      if (!nums.length) { toast('Aucun épisode n’est encore disponible pour la saison ' + n + ' : rien à modifier.', 'error'); return; }
      commit(key, (t) => C.setSeasonStatus(t, n, nums, status, activityStamp()),
        { undo: (n === 0 ? 'Épisodes spéciaux' : 'Saison ' + n) + ' : ' + nums.length + ' épisode(s) marqué(s) « ' + C.STATUS_LABELS[status] + ' ».' });
    },
    'season-toggle'(el) {
      const key = el.dataset.key, n = Number(el.dataset.season);
      const set = expandedSeasons(key);
      if (set.has(n)) set.delete(n); else set.add(n);
      patchSeason(key, n);
      if (set.has(n)) ensureSeason(key, n).catch(noop);
    },
    'season-retry'(el) { ensureSeason(el.dataset.key, Number(el.dataset.season)).catch(noop); },
    'show-start'(el) { commit(el.dataset.key, (t) => C.startShow(t, activityStamp())); },
    'show-reset'(el) { commit(el.dataset.key, (t) => C.resetShow(t, activityStamp()), { undo: 'Progression de « ' + itemTitle(el.dataset.key) + ' » remise à « À voir ».' }); },
    async 'show-all-seen'(el) {
      const key = el.dataset.key;
      if (state.ui.busy['all:' + key] || !state.cache.details.has(key)) return;
      setBusy('all:' + key, true);
      patchTrackBox(key);
      try {
        const { map, failed } = await loadRegularSeasons(key, (done, total) => {
          const b = document.querySelector('[data-action="show-all-seen"][data-key="' + key + '"]');
          if (b) b.textContent = 'Chargement des saisons… ' + done + '/' + total;
        });
        const count = Object.values(map).reduce((n, a) => n + a.length, 0);
        if (!count) { toast('Aucun épisode disponible : rien n’a été marqué.', 'error'); return; }
        commit(key, (t) => C.markShowSeen(t, map, activityStamp()), { undo: count + ' épisode(s) marqué(s) « Vu ».' });
        if (failed.length) toast('Saison(s) ' + failed.join(', ') + ' impossible(s) à charger : elles n’ont pas été modifiées et la série reste « En cours ».', 'error', null, 9000);
      } finally {
        setBusy('all:' + key, false);
        patchTrackBox(key);
      }
    },
    'legacy-apply'(el) { actions['show-all-seen'](el); },
    'legacy-dismiss'(el) { commit(el.dataset.key, (t) => C.dismissLegacy(t)); },
    async 'remove-item'(el) {
      const key = el.dataset.key;
      const title = itemTitle(key);
      const pk = C.parseKey(key);
      commit(key, () => C.emptyTrack(pk.type, pk.id), { undo: '« ' + title + ' » retiré de ta liste (progression, favori et watchlist).' });
    },
    'retry-section'(el) { const sec = HOME_SECTIONS.find((s) => s.id === el.dataset.section); if (sec) loadHomeSection(sec, true); },
    'agenda-refresh'() { loadAgenda(true); },
    'retry-detail'() { if (state.route.name === 'detail') loadDetail(state.route, true); },
    'retry-search'() { startSearch(state.ui.search.q, state.ui.search.filters, 1); },
    'search-more'() { const s = state.ui.search; startSearch(s.q, s.filters, s.page + 1); },
    'search-type'(el) {
      const f = C.parseSearchFilters(Object.assign({}, state.ui.search.filters, { type: el.dataset.type }));
      navigate(searchHash(state.ui.search.q || byId('search-input').value.trim(), f), state.route.name === 'search');
    },
    'search-reset'() { navigate(searchHash(state.ui.search.q, C.parseSearchFilters({ type: state.ui.search.filters.type })), true); },
    'discover'(el) { navigate(searchHash('', C.parseSearchFilters(JSON.parse(el.dataset.filters))), false); },
    'lib-status'(el) {
      state.data.preferences.libraryStatus = el.dataset.status;
      persist();
      if (state.route.params.status) navigate(C.buildHash(state.route.name, {}), true); else renderView();
    },
    'rail-scroll'(el) {
      const rail = byId('rail-' + el.dataset.rail);
      rail.scrollBy({ left: Number(el.dataset.dir) * rail.clientWidth * 0.85, behavior: 'smooth' });
    },
    'toggle-theme'() { setTheme(state.data.preferences.theme === 'dark' ? 'light' : 'dark'); },
    'set-theme'(el) { setTheme(el.dataset.theme); },
    'dismiss-banner'(el) { removeBanner(el.dataset.banner); },
    'trailer-open'(el) {
      const d = state.cache.details.get(el.dataset.key);
      if (!d || !d.trailer) return;
      const t = d.trailer;
      byId('trailer-title').textContent = (t.name || 'Bande-annonce') + ' · ' + d.title;
      const frame = document.createElement('iframe');
      frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(t.key) + '?autoplay=1&rel=0&hl=fr';
      frame.title = 'Bande-annonce de ' + d.title;
      frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      frame.allowFullscreen = true;
      frame.referrerPolicy = 'strict-origin-when-cross-origin'; // YouTube refuse la lecture intégrée sans l'origine du site (erreur 153)
      byId('trailer-frame').replaceChildren(frame);
      const link = document.createElement('a');
      link.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(t.key);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Ouvrir sur YouTube';
      byId('trailer-foot').replaceChildren((t.lang === 'fr' ? 'Vidéo YouTube proposée par TMDB. ' : 'Pas de version française sur TMDB : version originale. ') + 'Si elle ne se lance pas : ', link);
      byId('trailer-dialog').showModal();
    },
    'poster-zoom'(el) {
      const item = viewMeta(el.dataset.key);
      if (item.posterPath) openLightbox([img(item.posterPath, 'w780')], 0, 'Affiche · ' + item.title);
    },
    'gallery-open'(el) {
      const d = state.cache.details.get(el.dataset.key);
      if (d && d.gallery.length) openLightbox(d.gallery.map((p) => img(p, 'w1280')), Number(el.dataset.index) || 0, d.title);
    },
    'lightbox-prev'() { stepLightbox(-1); },
    'lightbox-next'() { stepLightbox(1); },
    'lightbox-close'() { byId('lightbox').close(); },
    'trailer-close'() { byId('trailer-frame').replaceChildren(); byId('trailer-dialog').close(); },
    async 'sync-signin'() { await signIn(); },
    async 'sync-signout'() { await signOutSync(); },
    'sync-now'() { if (Object.keys(sync.state.dirty).length) schedulePush(0); else toast('Tout est déjà synchronisé.', 'success'); },
    'unblock-storage'() { state.persistBlocked = false; removeBanner('corrupt'); persist(); toast('La sauvegarde repart de zéro.', 'success'); },
    'toast-action'(el) { const run = toastActions.get(el.dataset.toast); removeToast(el.dataset.toast); if (run) run(); },
    'toast-close'(el) { removeToast(el.dataset.toast); },
    'dialog-choose'(el) { byId('app-dialog').close(el.dataset.value); },
    'export-full'() { downloadJson('crazy-liste-sauvegarde-' + todayIso() + '.json', D.buildFullExport(state.data, new Date().toISOString())); },
    'export-lists'() { downloadJson('crazy-liste-favoris-watchlist-' + todayIso() + '.json', D.buildListsExport(state.data, new Date().toISOString())); },
    'import-open'() { byId('import-file').click(); },
    async 'key-save'() {
      const k = byId('tmdb-key-input').value.trim();
      if (!/^[\w.\-]{16,600}$/.test(k)) { setKeyResult('err', 'Format invalide : colle une clé API v3 (32 caractères) ou un jeton d’accès v4.'); return; }
      setKeyResult('', 'Test de la clé auprès de TMDB…');
      try {
        await tmdb('/configuration', {}, { key: k, noCache: true });
        state.data.preferences.apiKey = k;
        persist();
        pushSettings();
        resetNetworkState();
        setKeyResult('ok', 'Clé valide : elle est enregistrée et utilisée.');
      } catch (err) {
        setKeyResult('err', (err.kind === 'auth' ? 'TMDB refuse cette clé.' : err.message) + ' La clé n’a pas été enregistrée.');
      }
    },
    'key-reset'() {
      state.data.preferences.apiKey = '';
      persist();
      pushSettings();
      resetNetworkState();
      renderView();
      toast(DEFAULT_TMDB_KEY ? 'Clé intégrée rétablie.' : 'Clé retirée.', 'success');
    },
    async 'clear-data'() {
      const choice = await ask('Effacer toutes mes données ?', '<p>Ta progression, tes favoris et ta watchlist seront supprimés de ce navigateur. Une copie de secours est conservée sous la clé « crazy-liste-backup-before-reset ».</p>',
        [{ value: 'cancel', label: 'Annuler' }, { value: 'clear', label: 'Tout effacer', tone: 'danger' }]);
      if (choice !== 'clear') return;
      if (!storage.set('crazy-liste-backup-before-reset', JSON.stringify(state.data)).ok && storage.available) { toast('Copie de secours impossible : rien n’a été effacé.', 'error'); return; }
      const prefs = state.data.preferences;
      state.data = D.emptyData();
      state.data.preferences = prefs;
      persist();
      renderAll();
      toast('Données effacées. La copie de secours reste disponible dans le navigateur.', 'success');
    }
  };
  function setTheme(theme) {
    state.data.preferences.theme = theme === 'light' ? 'light' : 'dark';
    applyTheme();
    persist();
    if (state.route.name === 'settings') renderView();
  }
  function applyTheme() {
    const t = state.data.preferences.theme;
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('[data-theme-label]').forEach((el) => { el.textContent = t === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'; });
  }
  function resetNetworkState() {
    requestCache.clear();
    state.ui.home = {};
    state.cache.details.clear();
    state.cache.seasons.clear();
    state.cache.collections.clear();

  function setKeyResult(tone, text) {
    if (state.route.name !== 'settings') return;
    const el = byId('key-result');

    el.textContent = text;
  }
  function downloadJson(filename, obj) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Fichier « ' + filename + ' » enregistré dans tes téléchargements.', 'success');
  }
  async function importFile(file) {
    let text;
    try { text = await file.text(); } catch (e) { toast('Lecture du fichier impossible.', 'error'); return; }
    const res = D.parseImportText(text);
    if (!res.ok) { showImportResult('err', 'Import refusé : ' + res.error); toast('Import refusé : ' + res.error, 'error', null, 8000); return; }
    const s = res.summary;
    const kind = { full: 'Sauvegarde complète Crazy Liste', lists: 'Export favoris + watchlist', legacy: 'Ancienne sauvegarde (version précédente)' }[res.kind];
    const choice = await ask('Importer « ' + file.name + ' »',
      '<p><strong>' + esc(kind) + '</strong> : ' + s.items + ' contenu(s), ' + s.favorites + ' favori(s), ' + s.watchlist + ' en watchlist, ' + s.episodes + ' épisode(s) renseigné(s).' +
      (res.invalid ? ' ' + res.invalid + ' entrée(s) invalide(s) seront ignorées.' : '') + '</p>' +
      '<p><strong>Fusionner</strong> ajoute ces contenus à ta liste (en cas de conflit, la progression la plus récente est gardée, favoris et watchlist sont cumulés).</p>' +
      '<p><strong>Remplacer</strong> remplace toute ta liste par ce fichier (copie de secours de la liste actuelle conservée).</p>',
      [{ value: 'cancel', label: 'Annuler' }, { value: 'replace', label: 'Remplacer', tone: 'danger' }, { value: 'merge', label: 'Fusionner', tone: 'primary' }]);
    if (choice === 'merge') {
      const r = D.mergeData(state.data, res.data);
      applyImported(r.data, 'Import fusionné : ' + r.report.added + ' contenu(s) ajouté(s), ' + r.report.updated + ' mis à jour.');
    } else if (choice === 'replace') {
      if (storage.available && !storage.set('crazy-liste-backup-before-import', JSON.stringify(state.data)).ok) { toast('Copie de secours impossible : import annulé.', 'error'); return; }
      const r = D.replaceData(state.data, res.data);
      applyImported(r.data, 'Liste remplacée par l’import (' + r.report.added + ' contenu(s)). Ancienne liste copiée sous « crazy-liste-backup-before-import ».');
    } else {
      showImportResult('', 'Import annulé : rien n’a été modifié.');
    }
  }
  function applyImported(data, message) {
    state.data = data;
    applyTheme();
    persist();
    renderAll();
    showImportResult('ok', message);
    toast(message, 'success', null, 7000);
    refreshStaleMetadata();
  }
  function showImportResult(tone, text) {
    if (state.route.name !== 'settings') return;
    const el = byId('import-result');
    el.className = 'hint' + (tone === 'ok' ? ' ok-text' : tone === 'err' ? ' err-text' : '');
    el.textContent = text;
  }

  /* ===== Toasts et dialogue ===== */
  let toastSeq = 0;
  const toastActions = new Map();
  function toast(message, tone, action, timeout) {
    const id = 't' + (++toastSeq);
    const root = byId('toasts');
    const el = document.createElement('div');
    el.className = 'toast toast-' + (tone || 'info');
    el.dataset.toastId = id;
    const p = document.createElement('p');
    p.textContent = message;
    el.append(p);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-sm'; b.textContent = action.label;
      b.dataset.action = 'toast-action'; b.dataset.toast = id;
      el.append(b);
      toastActions.set(id, action.run);
    }
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'btn btn-sm btn-ghost btn-icon'; x.textContent = '✕';
    x.setAttribute('aria-label', 'Fermer'); x.dataset.action = 'toast-close'; x.dataset.toast = id;
    el.append(x);
    root.append(el);
    while (root.children.length > 3) removeToast(root.firstElementChild.dataset.toastId);
    setTimeout(() => removeToast(id), timeout || (action ? 8000 : 4500));
  }
  function removeToast(id) {
    toastActions.delete(id);
    const el = document.querySelector('[data-toast-id="' + id + '"]');
    if (el) el.remove(); // déjà fermé par l'utilisateur : rien à faire
  }
  /* Visionneuse : une liste d'adresses d'images, l'index affiché et un titre. */
  const lightbox = { urls: [], index: 0, title: '' };
  function openLightbox(urls, index, title) {
    Object.assign(lightbox, { urls, index: Math.max(0, Math.min(urls.length - 1, index)), title });
    showLightbox();
    const dlg = byId('lightbox');
    if (!dlg.open) dlg.showModal();
  }
  function stepLightbox(delta) {
    if (lightbox.urls.length < 2) return;
    lightbox.index = (lightbox.index + delta + lightbox.urls.length) % lightbox.urls.length;
    showLightbox();
  }
  function showLightbox() {
    const many = lightbox.urls.length > 1;
    const im = byId('lightbox-img');
    im.src = lightbox.urls[lightbox.index];
    im.alt = lightbox.title;
    byId('lightbox-caption').textContent = lightbox.title + (many ? ' · ' + (lightbox.index + 1) + ' / ' + lightbox.urls.length : '');
    document.querySelectorAll('#lightbox .lb-prev, #lightbox .lb-next').forEach((b) => { b.hidden = !many; });
  }
  let dialogResolve = null;
  function ask(title, html, buttons) {
    const dlg = byId('app-dialog');
    if (dialogResolve) { dialogResolve('cancel'); dialogResolve = null; }
    byId('dialog-title').textContent = title;
    byId('dialog-content').innerHTML = html;
    byId('dialog-actions').innerHTML = buttons.map((b) => '<button type="button" class="btn' + (b.tone ? ' btn-' + b.tone : '') + '" data-action="dialog-choose" data-value="' + esc(b.value) + '">' + esc(b.label) + '</button>').join('');
    dlg.returnValue = '';
    return new Promise((resolve) => { dialogResolve = resolve; dlg.showModal(); });
  }

  /* ===== Fragments HTML : fonctions de rendu en lecture seule (aucune écriture d'état, aucune date courante) ===== */
  const STATUS_LABELS = C.STATUS_LABELS, TYPE_LABELS = C.TYPE_LABELS;
  const CHEVRON = '<svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  function statusBadge(status, key) {
    return '<span class="status status-' + status + '"' + (key ? ' data-status-for="' + key + '"' : '') + '>' + STATUS_LABELS[status] + '</span>';
  }
  function ratingHtml(v, title) {
    return '<span class="rating rating-' + C.ratingTier(v) + '" title="' + esc(title || 'Note TMDB') + '">' + C.formatRating(v) + '</span>';
  }
  function posterHtml(item, size) {
    const src = img(item.posterPath, size);
    return '<span class="poster-fallback">' + esc(item.title) + '</span>' + (src ? '<img src="' + esc(src) + '" alt="" loading="lazy" decoding="async">' : '');
  }
  function toggleLabel(kind, on) {
    return kind === 'favorite' ? (on ? '♥ En favori' : '♡ Ajouter favori') : (on ? '✓ En watchlist' : '＋ Ajouter watchlist');
  }
  function listButton(kind, key, size) {
    const t = getTrack(key);
    const on = !!(t && t[kind]);
    return '<button type="button" class="btn ' + (size == null ? 'btn-sm' : size) + ' ' + (kind === 'favorite' ? 'btn-fav' : 'btn-watch') + '" data-action="toggle-' + kind +
      '" data-key="' + key + '" aria-pressed="' + on + '">' + toggleLabel(kind, on) + '</button>';
  }
  function segHtml(action, key, season, episode, current, label, large) {
    const attrs = ' data-key="' + key + '"' + (season != null ? ' data-season="' + season + '"' : '') + (episode != null ? ' data-episode="' + episode + '"' : '');
    return '<div class="seg' + (large ? ' seg-lg' : '') + '" role="group" aria-label="' + esc(label) + '">' + C.STATUSES.map((s) =>
      '<button type="button" data-action="' + action + '"' + attrs + ' data-status="' + s + '" aria-pressed="' + (current === s) + '">' + STATUS_LABELS[s] + '</button>').join('') + '</div>';
  }
  const AVAIL_LABELS = { upcoming: 'À venir', cinema: 'Au cinéma', available: 'Disponible', released: 'Sorti', unknown: 'Vérification…' };
  const AVAIL_TITLES = {
    upcoming: 'Pas encore sorti',
    cinema: 'Sorti au cinéma, pas encore disponible en vidéo à la demande, en streaming ou en DVD/Blu-ray',
    available: 'Film : disponible en vidéo à la demande, en streaming ou en DVD/Blu-ray (ou sorti depuis plus de 9 mois)',
    released: 'Sorti au cinéma ; sa sortie en vidéo n’a pas pu être vérifiée auprès de TMDB',
    unknown: 'Vérification de la sortie en vidéo auprès de TMDB'
  };
  function availHtml(st, key, date) {
    const label = st === 'upcoming' && date ? 'À venir · ' + C.formatDate(date).replace(/ \d{4}$/, (y) => (date.slice(0, 4) === state.today.slice(0, 4) ? '' : y)) : AVAIL_LABELS[st];
    return '<span class="avail avail-' + st + '" data-avail="' + st + '" data-avail-for="' + key + '" data-avail-date="' + esc(date) + '"' + (AVAIL_TITLES[st] ? ' title="' + AVAIL_TITLES[st] + '"' : '') + '>' + esc(label || '') + '</span>';
  }
  function cardAvail(item) {
    const st = availability(item);
    return availHtml(st, item.key, item.date || '');
  }
  function cardHtml(item) {
    const key = item.key;
    return '<article class="card" data-item-key="' + key + '">' +
      '<div class="poster">' + posterHtml(item, 'w342') + ratingHtml(item.voteAverage) + (C.isAnime(item) ? '<span class="type-tag">Anime</span>' : '') + cardAvail(item) + '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title"><a class="card-link" href="' + C.detailHash(item.type, item.id) + '">' + esc(item.title) + '</a></h3>' +
        '<div class="card-meta"><span>' + esc(item.year || 'Date inconnue') + '</span><span aria-hidden="true">·</span><span>' + TYPE_LABELS[item.type] + '</span></div>' +
        '<div class="card-meta">' + statusBadge(itemState(key).status, key) + '</div>' +
        (item.overview ? '<p class="card-overview">' + esc(item.overview) + '</p>' : '') +
        '<div class="card-actions">' + listButton('favorite', key) + listButton('watchlist', key) + '</div>' +
      '</div></article>';
  }
  function skeletonCards(n) { return '<div class="skeleton card-skeleton" aria-hidden="true"></div>'.repeat(n); }
  function errorHtml(err, action, attrs) {
    const kind = err && err.kind;
    return '<div class="error-box" role="alert"><p>' + esc(err && err.message ? err.message : 'Erreur inattendue.') + '</p>' +
      '<button type="button" class="btn btn-sm" data-action="' + action + '"' + (attrs || '') + '>Réessayer</button>' +
      (['auth', 'nokey', 'login', 'relayauth'].includes(kind) ? '<a class="btn btn-sm" href="#settings">' + (kind === 'login' || kind === 'relayauth' ? 'Se connecter' : 'Réglages TMDB') + '</a>' : '') + '</div>';
  }
  function emptyHtml(title, text, link) {
    return '<div class="empty"><strong>' + esc(title) + '</strong>' + (text ? esc(text) : '') +
      (link ? '<br><a class="btn btn-sm" href="' + link.href + '">' + esc(link.label) + '</a>' : '') + '</div>';
  }

  /* ----- Accueil ----- */
  function homeHtml() {
    if (!tmdbReady()) return welcomeHtml();
    return '<div class="page-head"><div><h1>Crazy Liste</h1><p>Tendances et nouveautés TMDB. Clique sur une affiche pour ouvrir sa fiche et suivre ta progression.</p></div>' + availToggleHtml() + '</div>' +
      HOME_SECTIONS.map((sec) => '<section class="section" id="home-sec-' + sec.id + '" aria-labelledby="home-title-' + sec.id + '">' + homeSectionInner(sec) + '</section>').join('');
  }
  /* Aucune clé TMDB (version publique, premier lancement) : un seul message clair au lieu de six erreurs. */
  function welcomeHtml() {
    const canSignIn = sync.fb && !sync.user;
    if (TMDB_RELAY && /^https?:$/.test(location.protocol)) {
      const head = '<div class="page-head"><div><h1>Bienvenue sur Crazy Liste</h1><p>Suis tes films, séries et anime, épisode par épisode.</p></div></div>';

        '<p>Connecte-toi avec ton compte Google : les films et séries s’affichent, et ta liste est enregistrée dans ton compte, sur tous tes appareils. Aucune clé à fournir.</p>' +
        (sync.status === 'error' ? '<p class="hint">' + esc(sync.error) + '</p>' : '') +
        '<div class="row">' + (canSignIn ? '<button type="button" class="btn btn-primary" data-action="sync-signin"' + (sync.status === 'signing' ? ' disabled' : '') + '>Se connecter avec Google</button>' : '') +
        '<a class="btn" href="#settings">J’ai ma propre clé TMDB</a></div></section>';

      (canSignIn ? '<p><strong>Tu utilises déjà Crazy Liste sur un autre appareil ?</strong> Connecte-toi avec le même compte Google : ta liste et ta clé TMDB arrivent automatiquement.</p>' : '') +
      '<p>' + (canSignIn ? 'Sinon, colle' : 'Colle') + ' ta clé TMDB gratuite dans Réglages (themoviedb.org › Paramètres › API).</p>' +
      '<div class="row">' + (canSignIn ? '<button type="button" class="btn btn-primary" data-action="sync-signin"' + (sync.status === 'signing' ? ' disabled' : '') + '>Se connecter avec Google</button>' : '') +
      '<a class="btn' + (canSignIn ? '' : ' btn-primary') + '" href="#settings">Coller ma clé TMDB</a></div></section>';

  function availToggleHtml() {

      '<span class="hint">sortis en vidéo / streaming</span></label>';

  function homeSectionInner(sec) {
    const s = state.ui.home[sec.id] || { status: 'loading' };

    if (ready && !shown.length) body = '<p class="hint rail-hidden">Tout est masqué par « Seulement les titres disponibles ».</p>';
    else if (ready) body = '<div class="rail" id="rail-' + sec.id + '">' + shown.map(cardHtml).join('') + '</div>';
    else if (s.status === 'error') body = errorHtml(s.error, 'retry-section', ' data-section="' + sec.id + '"');
    else if (s.status === 'empty') body = emptyHtml('Rien à afficher pour le moment.', '');
    else body = '<div class="rail" aria-busy="true">' + skeletonCards(6) + '</div>';
    const nav = ready && shown.length ? '<div class="rail-nav"><button type="button" class="btn btn-sm btn-icon" data-action="rail-scroll" data-rail="' + sec.id + '" data-dir="-1" aria-label="Défiler vers la gauche">‹</button>' +
      '<button type="button" class="btn btn-sm btn-icon" data-action="rail-scroll" data-rail="' + sec.id + '" data-dir="1" aria-label="Défiler vers la droite">›</button></div>' : '';

  /* ----- Recherche ----- */
  const TYPE_CHIPS = [['all', 'Tout'], ['movie', 'Films'], ['tv', 'Séries'], ['anime', 'Anime']];
  const SORT_LABELS = { popular: 'Popularité', rating: 'Mieux notés', newest: 'Plus récents', oldest: 'Plus anciens' };
  function searchHtml() {
    const f = state.ui.search.filters;
    return '<div class="page-head"><div><h1>Recherche</h1><p>Cherche un titre, ou découvre de nouveaux contenus avec des filtres, sans rien taper.</p></div></div>' +
      '<div class="toolbar" role="group" aria-label="Type de contenu">' + TYPE_CHIPS.map(([v, l]) =>
        '<button type="button" class="chip chip-btn" data-action="search-type" data-type="' + v + '" aria-pressed="' + (f.type === v) + '"' + (v === 'tv' ? ' title="Toutes les séries, anime compris"' : '') + '>' + l + '</button>').join('') + '</div>' +
      '<div class="filters" id="search-filters" role="group" aria-label="Filtres">' + filtersHtml(f) + '</div>' +
      '<div id="search-results">' + searchBodyHtml() + '</div>';
  }
  function filtersHtml(f) {
    const select = (name, label, options, current) => '<label class="filter"><span>' + label + '</span><select class="select" data-change="search-filter" data-filter="' + name + '">' +
      options.map(([v, l]) => '<option value="' + v + '"' + (current === v ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select></label>';
    const year = (name, label, value, ph) => '<label class="filter filter-year"><span>' + label + '</span><input class="input" type="number" inputmode="numeric" min="1900" max="2100" step="1" placeholder="' + ph + '" value="' + value + '" data-change="search-filter" data-filter="' + name + '"></label>';
    const series = f.type === 'tv' || f.type === 'anime';
    const genres = C.genresFor(f.type);
    return (series ? select('status', 'Statut', [['any', 'Tous'], ['ended', 'Terminés'], ['airing', 'En cours de diffusion'], ['soon', 'Saison annoncée < 6 mois'], ['later', 'Saison annoncée > 6 mois ou sans date'], ['ongoing', 'Pas terminés (tous)']], f.status) : '') +
      year('from', 'Depuis l’année', f.from, '1990') + year('to', 'Jusqu’à l’année', f.to, String(new Date().getFullYear())) +
      (genres.length ? select('genre', 'Genre', [['', 'Tous']].concat(genres.map(([id, l]) => [String(id), l])), f.genre) : '') +
      select('rating', 'Note TMDB', [['', 'Toutes'], ['6', '6 et plus'], ['7', '7 et plus'], ['8', '8 et plus']], f.rating) +
      select('sort', 'Trier par', [['', state.ui.search.q ? 'Pertinence' : 'Popularité'], ['rating', 'Mieux notés'], ['newest', 'Plus récents'], ['oldest', 'Plus anciens']], f.sort === 'popular' ? '' : f.sort) +
      availToggleHtml() +
      (C.hasRefinement(Object.assign({}, f, { type: 'all' })) ? '<button type="button" class="btn btn-sm btn-ghost filter-reset" data-action="search-reset">Effacer les filtres</button>' : '');
  }
  function filterSummary(f) {
    const parts = [];
    const typeLabel = { movie: 'Films', tv: 'Séries', anime: 'Anime' }[f.type];
    if (typeLabel) parts.push(typeLabel);
    if (f.status !== 'any') parts.push({ ended: 'terminés', airing: 'en cours de diffusion', soon: 'saison annoncée dans moins de 6 mois', later: 'saison annoncée dans plus de 6 mois ou sans date', ongoing: 'pas terminés' }[f.status]);
    if (f.from && f.to) parts.push(f.from === f.to ? 'sortis en ' + f.from : 'sortis de ' + f.from + ' à ' + f.to);
    else if (f.from) parts.push('sortis depuis ' + f.from);
    else if (f.to) parts.push('sortis jusqu’en ' + f.to);
    if (f.genre) { const g = C.genresFor(f.type).find(([id]) => String(id) === f.genre); if (g) parts.push(g[1].toLowerCase()); }
    if (f.rating) parts.push('note ' + f.rating + '+');
    if (f.sort && f.sort !== 'popular') parts.push('triés : ' + SORT_LABELS[f.sort].toLowerCase());
    return parts.join(' · ');
  }
  const DISCOVER_IDEAS = [
    ['Anime terminés les mieux notés', { type: 'anime', status: 'ended', sort: 'rating' }],
    ['Séries terminées, 8 et plus', { type: 'tv', status: 'ended', rating: '8', sort: 'rating' }],
    ['Films les mieux notés depuis 2020', { type: 'movie', from: '2020', sort: 'rating' }],
    ['Anime récents', { type: 'anime', sort: 'newest' }],
    ['Anime en cours de diffusion', { type: 'anime', status: 'airing' }],
    ['Séries à rattraper avant leur prochaine saison', { type: 'tv', status: 'later', sort: 'rating' }],
    ['Science-fiction (séries)', { type: 'tv', genre: '10765' }],
    ['Films d’horreur populaires', { type: 'movie', genre: '27' }]
  ];
  function searchBodyHtml() {
    const s = state.ui.search;
    const f = s.filters;
    if (s.status === 'idle') {
      return '<div class="empty"><strong>Que veux-tu regarder ?</strong>Tape un titre dans la barre de recherche, ou choisis un type et des filtres ci-dessus pour explorer TMDB. Quelques idées :' +
        '<div class="ideas">' + DISCOVER_IDEAS.map(([l, o]) => '<button type="button" class="chip chip-btn" data-action="discover" data-filters="' + esc(JSON.stringify(o)) + '">' + esc(l) + '</button>').join('') + '</div></div>';
    }
    const what = s.mode === 'text' ? '« ' + s.q + ' »' + (C.hasRefinement(f) ? ' · ' + filterSummary(f) : '') : filterSummary(f);
    if (s.status === 'loading') return '<p class="hint" role="status">' + (s.mode === 'text' ? 'Recherche de ' : 'Exploration de TMDB : ') + esc(what) + '…</p><div class="grid" aria-busy="true">' + skeletonCards(8) + '</div>';
    if (s.status === 'error') return errorHtml(s.error, 'retry-search');
    if (s.status === 'empty') {
      return emptyHtml(s.mode === 'text' ? 'Aucun résultat pour ' + what : 'Aucun résultat : ' + what, C.hasRefinement(f) ? 'Élargis les filtres (années, note, statut) ou essaie « Effacer les filtres ».' : 'Vérifie l’orthographe ou essaie le titre original.');
    }
    const loadingMore = s.status === 'loading-more';
    const more = s.page < s.totalPages ? '<div class="row" style="justify-content:center;margin-top:16px"><button type="button" class="btn" data-action="search-more"' + (loadingMore ? ' disabled' : '') + '>' +
      (loadingMore ? 'Chargement…' : s.mode === 'text' && s.hidden ? 'Chercher plus loin' : 'Plus de résultats') + '</button></div>' : '';
    const hiddenNote = s.hidden ? ' · ' + s.hidden + ' autre(s) titre(s) écarté(s) par tes filtres' + (s.mode === 'discover' ? ' (vérifiés sur leur fiche)' : '') : '';
    const sortNote = s.mode === 'text' && f.sort && f.sort !== 'popular' ? ' · tri appliqué aux résultats chargés' : '';
    const votes = s.mode === 'discover' && (f.sort === 'rating' || f.rating) ? C.minVotesFor(f, f.type === 'movie', s.voteLevel) : 0;
    const voteNote = votes ? (s.voteLevel ? ' · peu de votes sur cette période : titres notés par au moins ' + votes + ' personnes' : ' · titres notés par au moins ' + votes + ' personnes') : '';
    const results = filterAvailable(s.results);
    const unavailable = s.results.length - results.length;
    const availNote = unavailable ? ' · ' + unavailable + ' pas encore disponible(s), masqué(s)' : '';
    return '<p class="hint" role="status">' + results.length + ' résultat(s) : ' + esc(what) + esc(hiddenNote + sortNote + availNote) + '</p>' +
      (voteNote ? '<p class="hint">' + esc(voteNote.slice(3).replace(/^./, (c) => c.toUpperCase())) + '.</p>' : '') +
      (results.length ? '<div class="grid">' + results.map(cardHtml).join('') + '</div>' : '<p class="hint">Aucun titre de cette page ne correspond à tes filtres.</p>') + more;
  }
  function renderSearchBody() {
    if (state.renderedView !== 'search') return;

  }

  /* ----- Bibliothèque, Favoris, Watchlist ----- */

    const total = C.computeLibrary(state.data, { list }).length;

      select('lib-sort', 'lib-sort', 'Tri', prefs.librarySort, [['activity', 'Activité récente'], ['added', 'Ajout récent'], ['title', 'Titre (A → Z)'], ['rating', 'Note TMDB']]) +
      '</div>' + body;

  /* ----- À venir pour moi ----- */

  /* ----- Statistiques détaillées ----- */
  function formatDuration(min) {
    if (!min) return '0 h';
    const h = Math.round(min / 60);
    return h < 1 ? min + ' min' : h.toLocaleString('fr-FR') + ' h';
  }
  function runtimeProgressText() { const st = state.cache.runtimes; return 'Récupération des durées depuis TMDB… ' + st.loaded + ' / ' + st.total; }
  function listTabsHtml(name) {
    return '<nav class="tabs" aria-label="Mes listes">' + [['library', 'Bibliothèque'], ['favorites', 'Favoris'], ['watchlist', 'Watchlist'], ['stats', 'Statistiques']].map(([r, l]) =>
      '<a href="#' + r + '"' + (r === name ? ' aria-current="page"' : '') + '>' + l + '</a>').join('') + '</nav>';
  }
  function statsHtml() {
    const s = C.computeStats(state.data);
    const i = C.computeInsights(state.data, state.today);
    const head = listTabsHtml('stats') + '<div class="page-head"><div><h1>Statistiques</h1><p>Ce que tu as regardé, d’après ton suivi dans Crazy Liste.</p></div></div>';
    if (!s.total) return head + emptyHtml('Pas encore de statistiques.', 'Marque des films ou des épisodes comme vus pour les voir apparaître ici.', { href: '#home', label: 'Explorer l’accueil' });
    const days = i.totalMinutes / 1440;
    const tiles = [
      ['time', formatDuration(i.totalMinutes), 'devant l’écran', days >= 1 ? 'soit ' + (days < 10 ? days.toFixed(1).replace('.', ',') : Math.round(days)) + ' jours' : ''],
      ['movies', String(i.moviesSeen), 'film' + (i.moviesSeen > 1 ? 's' : '') + ' vu' + (i.moviesSeen > 1 ? 's' : ''), formatDuration(i.movieMinutes)],
      ['episodes', i.episodes.toLocaleString('fr-FR'), 'épisode' + (i.episodes > 1 ? 's' : '') + ' vu' + (i.episodes > 1 ? 's' : ''), formatDuration(i.episodeMinutes)],
      ['shows', String(i.showsDone), 'série' + (i.showsDone > 1 ? 's' : '') + ' terminée' + (i.showsDone > 1 ? 's' : ''), i.showsStarted + ' en cours']
    ];
    const rt = state.cache.runtimes;
    const note = rt.status === 'loading' ? '<p class="hint" role="status" id="runtime-progress">' + runtimeProgressText() + '</p>'
      : i.unknownRuntime ? '<p class="hint">Durée inconnue sur TMDB pour ' + i.unknownRuntime + ' titre(s) : non comptés dans le temps total.</p>' : '';
    const maxG = Math.max(1, ...i.topGenres.map((g) => g.count));
    const genres = i.topGenres.length ? '<ol class="bars">' + i.topGenres.map((g) => '<li><span class="bar-label">' + esc(g.name) + '</span><span class="bar-track"><span class="bar-fill" style="width:' +
      Math.round((g.count / maxG) * 100) + '%"></span></span><span class="bar-value">' + g.count + '</span></li>').join('') + '</ol>' : '<p class="muted">Pas encore assez de titres vus.</p>';
    const maxM = Math.max(1, ...i.months.map((m) => m.count));
    const months = '<div class="month-chart" role="img" aria-label="Titres terminés par mois sur 12 mois : ' + esc(i.months.map((m) => m.label + ' ' + m.count).join(', ')) + '">' +
      i.months.map((m) => '<div class="month" data-month="' + m.key + '"><span class="month-value">' + (m.count || '') + '</span><span class="month-bar"><span style="height:' +
        Math.round((m.count / maxM) * 100) + '%"></span></span><span class="month-label">' + esc(m.label) + '</span></div>').join('') + '</div>';
    return head + '<div class="insight-tiles">' + tiles.map(([id, v, l, sub]) => '<div class="insight" data-insight="' + id + '"><strong>' + esc(v) + '</strong><span>' + esc(l) + '</span>' +
      (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>').join('') + '</div>' + note +
      '<div class="insight-grid"><section class="panel"><h2>Genres préférés</h2><p class="hint">Parmi les titres vus ou en cours.</p>' + genres + '</section>' +
      '<section class="panel"><h2>Titres terminés par mois</h2><p class="hint">Films vus et séries terminées sur les 12 derniers mois.' +
      (i.approxDates ? ' Pour les titres terminés avant cette fonctionnalité, la date utilisée est celle de ta dernière activité.' : '') + '</p>' + months + '</section></div>';
  }

  /* ----- Sagas ----- */
  function sagaItem(k) { return state.cache.summaries.get(k) || state.data.metadata[k] || null; }
  function sagaStats(saga, opts) {
    const today = state.today;
    const keys = C.sagaSections(saga, Object.assign({}, opts, { order: 'release' }), sagaDate).flatMap((s) => s.keys);
    const released = keys.filter((k) => { const d = sagaDate(k); return d && d <= today; });
    const seen = keys.filter((k) => itemState(k).status === 'seen');
    return { total: keys.length, released: released.length, seen: seen.length };
  }
  function sagaDate(k) { const it = sagaItem(k); return it && it.date ? it.date : ''; }
  function sagaNext(saga, opts) {
    const today = state.today;
    for (const sec of C.sagaSections(saga, opts, sagaDate)) for (const k of sec.keys) {
      const d = sagaDate(k);
      if (d && d <= today && itemState(k).status !== 'seen' && C.isAvailable(availability(sagaItem(k)))) return k;
    }
    return null;
  }
  function sagasHtml() {
    return '<div class="page-head"><div><h1>Sagas</h1><p>Revois les grands univers dans l’ordre, phase par phase, et suis où tu en es.</p></div></div>' +
      '<div class="saga-list">' + C.SAGAS.map((sg) => {
        const all = C.sagaKeys(sg, false);
        const seen = all.filter((k) => itemState(k).status === 'seen').length;
        const pct = all.length ? Math.round((seen / all.length) * 100) : 0;
        return '<a class="saga-tile" href="#saga/' + sg.id + '" style="--saga:' + sg.accent + '"><span class="saga-badge" aria-hidden="true">' + esc(sg.short) + '</span>' +
          '<span class="saga-tile-body"><strong>' + esc(sg.name) + '</strong><span>' + esc(sg.intro) + '</span>' +
          '<span class="saga-meta">' + all.length + ' titres · ' + sg.groups.filter((g) => !g.optional).length + ' étapes · ' + seen + ' vu' + (seen > 1 ? 's' : '') + '</span>' +
          '<span class="saga-bar" aria-hidden="true"><span style="width:' + pct + '%"></span></span></span></a>';
      }).join('') + '</div>' +
      '<p class="hint" style="margin-top:14px">Phases et ordre de l’histoire établis pour Crazy Liste (TMDB ne les fournit pas) ; titres, dates et affiches viennent de TMDB.</p>';
  }
  function sagaHtml() {
    const r = state.route;
    const saga = C.findSaga(r.sagaId);
    if (!saga) return notFoundHtml('Saga introuvable', 'Cette saga n’existe pas (encore) dans Crazy Liste.');
    const o = C.parseSagaParams(r.params);
    const link = (patch) => '#saga/' + saga.id + (() => { const q = new URLSearchParams(C.sagaParamsToQuery(Object.assign({}, o, patch))).toString(); return q ? '?' + q : ''; })();
    const chip = (on, href, label) => '<a class="chip chip-btn" href="' + href + '" aria-pressed="' + on + '">' + label + '</a>';
    const hasOptional = saga.groups.some((g) => g.optional);
    return '<div class="saga-page" style="--saga:' + saga.accent + '"><div class="page-head saga-head"><div><p class="saga-crumb"><a href="#sagas">Sagas</a> ›</p><h1>' + esc(saga.name) + '</h1><p>' + esc(saga.intro) + '</p></div></div>' +
      '<div class="saga-controls"><div class="seg seg-lg" role="group" aria-label="Ordre">' +
        '<a href="' + link({ order: 'release' }) + '" role="button" aria-pressed="' + (o.order === 'release') + '">Ordre de sortie</a>' +
        '<a href="' + link({ order: 'story' }) + '" role="button" aria-pressed="' + (o.order === 'story') + '">Ordre de l’histoire</a></div>' +
        '<div class="toolbar" role="group" aria-label="Type">' + chip(o.type === 'all', link({ type: 'all' }), 'Tout') + chip(o.type === 'movie', link({ type: 'movie' }), 'Films') + chip(o.type === 'tv', link({ type: 'tv' }), 'Séries') + '</div>' +
        (hasOptional ? '<a class="chip chip-btn" href="' + link({ extra: !o.extra }) + '" aria-pressed="' + o.extra + '">' + (o.extra ? '✓ ' : '＋ ') + esc(saga.groups.find((g) => g.optional).label) + '</a>' : '') + availToggleHtml() + '</div>' +
      (o.order === 'story' ? '<p class="hint saga-note">' + esc(saga.storyNote) + '</p>' : '') +
      '<div id="saga-body">' + sagaBodyHtml(saga, o) + '</div></div>';
  }
  function sagaBodyHtml(saga, o) {
    const st = state.cache.sagas[saga.id];
    if (!st || st.status === 'idle' || (st.status === 'loading' && st.loaded < st.total)) {
      if (st && st.status === 'loading') return '<p class="hint" role="status" id="saga-progress">Chargement des titres depuis TMDB… ' + st.loaded + ' / ' + st.total + '</p><div class="skeleton" style="height:240px;border-radius:16px" aria-busy="true"></div>';
    }
    const sections = C.sagaSections(saga, o, sagaDate).map((sec) => Object.assign({}, sec, { keys: sec.keys.filter((k) => !onlyAvailable() || C.isAvailable(availability(sagaItem(k) || { key: k, type: C.parseKey(k).type }))) })).filter((sec) => sec.keys.length);
    if (!sections.length) return emptyHtml('Aucun titre', onlyAvailable() ? 'Aucun titre disponible avec ces filtres.' : 'Aucun titre de ce type dans cette saga.');
    const stats = sagaStats(saga, o);
    const next = sagaNext(saga, o);
    const nextItem = next ? sagaItem(next) : null;
    const pk = next ? C.parseKey(next) : null;
    const failed = st && st.failed.length ? '<p class="hint err-text">' + st.failed.length + ' titre(s) n’ont pas pu être chargés depuis TMDB.</p>' : '';
    let n = 0;
    return '<div class="saga-summary"><div><span><strong>' + stats.seen + ' / ' + stats.released + '</strong> titres sortis vus' + (stats.total > stats.released ? ' · ' + (stats.total - stats.released) + ' à venir' : '') + '</span>' +

  /* Ligne sous le titre : titre original · type · saisons et épisodes · durée · date. */
  function detailSubline(item, d, isTv) {
    const parts = [];

      const n = d.seasonSummaries.filter((x) => x.number > 0).length;

      if (d.numberOfEpisodes) parts.push(d.numberOfEpisodes + ' épisode' + (d.numberOfEpisodes > 1 ? 's' : ''));
    }
    if (d && d.runtime) parts.push(formatRuntime(d.runtime) + (isTv ? ' / ép.' : ''));

  function trackBoxHtml(key) {
