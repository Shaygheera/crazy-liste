      '<div class="ep-num" aria-hidden="true">É' + ep.number + '</div>' +
      '<div class="ep-main"><p class="ep-title" title="' + esc(ep.name) + '"><span class="visually-hidden">Épisode ' + ep.number + ' : </span>' + esc(ep.name || 'Épisode ' + ep.number) + '</p>' +
        '<div class="ep-meta">' + (nextNum === ep.number ? '<span class="ep-next">Prochain</span>' : '') + statusBadge(status) +
        (ep.airDate ? '<span>' + esc(ep.airDate) + '</span>' : '') + (upcoming ? '<span class="chip">À venir</span>' : '') + (ep.runtime ? '<span>' + ep.runtime + ' min</span>' : '') +
        ratingHtml(ep.voteAverage, 'Note TMDB de l’épisode') + '</div></div>' +
      '<div class="ep-controls">' + segHtml('episode-status', key, n, ep.number, status, 'Statut de l’épisode ' + ep.number) +
        (index > 0 ? '<button type="button" class="btn btn-sm btn-ghost" data-action="episodes-upto" data-key="' + key + '" data-season="' + n + '" data-episode="' + ep.number +
          '" title="Marque comme vus les épisodes de cette saison jusqu’à É' + ep.number + ' inclus">Vu jusqu’ici</button>' : '') + '</div></div>';
  }

  /* ----- Fiche : carte Diffusion (série) ou Sortie et saga (film), recommandations ----- */
  function airingInfo(key) {
    const d = state.cache.details.get(key);
    if (!d || !d.nextEpisode) return null;
    const si = C.airingSeasonInfo(d, state.cache.seasons.get(key + '#' + d.nextEpisode.season) || null, state.today);
    const load = state.ui.seasonLoad[key + '#' + d.nextEpisode.season];
    if (si) si.loadError = !!load && load.status === 'error';
    return si;
  }
  function refreshAiringInfo(key) { if (state.route.name === 'detail' && state.route.key === key) renderRelated(); }
  const dcol = (id, label, big, sub, extra) => '<div class="dcol" data-col="' + id + '"><span class="dcol-label">' + label + '</span>' +
    (big ? '<strong class="dcol-big">' + big + '</strong>' : '') + (sub ? '<span class="dcol-sub">' + sub + '</span>' : '') + (extra || '') + '</div>';
  const dcard = (title, chip, cols, extra, n) => '<section class="dcard" aria-label="' + esc(title) + '"><div class="dcard-head"><h2 class="kicker">' + esc(title) + '</h2>' + (chip ? '<span class="chip">' + esc(chip) + '</span>' : '') + '</div><div class="dcols' + (n === 4 ? ' dcols-4' : '') + '">' + cols + '</div>' + (extra || '') + '</section>';
  /* Suite (confirmée par Wikidata, ou probable d'après la licence) et ligne des titres de la licence. */
  function suiteCol(key) {
    const rel = state.cache.relations.get(key);
    if (!rel || rel.status !== 'ready' || !rel.next) return '';
    const x = rel.next;
    const when = x.date ? (x.date > state.today ? 'à venir · ' + esc(C.formatDate(x.date)) : esc(x.year)) : 'à venir';
    return dcol('suite', rel.confirmed ? 'Suite' : 'Suite probable', '<a href="' + C.detailHash(x.type, x.id) + '">' + esc(x.title) + ' ›</a>',
      (x.type === 'movie' ? 'Film' : C.isAnime(x) ? 'Anime' : 'Série') + ' · ' + when + (rel.confirmed ? '' : ' · même licence, après celui-ci'));
  }
  function licenceRowHtml(key) {
    const rel = state.cache.relations.get(key);
    if (!rel || rel.status !== 'ready' || rel.list.length < 2) return '';
    const label = rel.base ? 'Licence « ' + esc((state.cache.details.get(key) || {}).title.split(/\s*[:：]\s*|\s+[-–—]\s+|\s*\(/)[0]) + ' » :' : 'Titres liés :';
    return '<div class="dlicence"><span class="dlicence-label">' + label + '</span>' + rel.list.map((x) => {
      const cur = x.key === key;
      const seen = getTrack(x.key) && itemState(x.key).status === 'seen';
      const inner = '<span class="lic-thumb">' + posterHtml(x, 'w92') + '</span><span class="lic-text">' + esc(x.title) + ' · ' + (x.date ? (x.date > state.today ? 'à venir' : esc(x.year)) : 'à venir') + '</span>' + (seen ? '<span class="lic-seen" title="Vu">✓</span>' : '');
      return cur ? '<span class="lic lic-current" aria-current="true" data-lic="' + x.key + '">' + inner + '</span>' : '<a class="lic" href="' + C.detailHash(x.type, x.id) + '" data-lic="' + x.key + '">' + inner + '</a>';
    }).join('') + '</div>';
  }
  /* Date proche : jour de la semaine (« Jeudi 27 novembre ») ; sinon date complète. Suivie de « dans 6 jours ». */
  function whenHtml(date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return 'Date non communiquée';
    const days = Math.round((Date.parse(date + 'T00:00:00Z') - Date.parse(state.today + 'T00:00:00Z')) / 86400000);
    let label = C.formatDate(date);
    if (days >= 0 && days <= 7) { const w = new Date(date + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'long', timeZone: 'UTC' }); label = w.charAt(0).toUpperCase() + w.slice(1) + ' ' + label.replace(/ \d{4}$/, ''); }
    const rel = C.relativeDay(date, state.today);
    return esc(label) + (rel ? ' · <span class="accent">' + esc(rel) + '</span>' : '');
  }
  const genericEpName = (name) => !name || /^(épisode|episode)\s*\d+$/i.test(name);
  function detailCardHtml(key) {
    const d = state.cache.details.get(key);
    if (!d) return state.ui.detail.status === 'error' ? '' : '<div class="dcard skeleton" style="height:112px" aria-hidden="true"></div>';
    return d.type === 'tv' ? tvCardHtml(key, d) : movieCardHtml(key, d);
  }
  function tvCardHtml(key, d) {
    const ne = d.nextEpisode, le = d.lastEpisode, si = airingInfo(key);
    const status = C.productionLabel(d.productionStatus, ne, state.today);
    const lastAired = le ? 'Dernier diffusé : <b>' + (si && le.season === si.season ? 'É' + le.episode : C.episodeLabel(le.season, le.episode)) + '</b>' + (le.airDate ? ' — ' + esc(C.formatDate(le.airDate).replace(/ \d{4}$/, (y) => (le.airDate.slice(0, 4) === state.today.slice(0, 4) ? '' : y))) : '') : '';
    if (!ne) {
      const n = d.seasonSummaries.filter((x) => x.number > 0).length;
      const sc = suiteCol(key);
      return dcard(sc ? 'Diffusion et suite' : 'Diffusion', status, dcol('last', 'Dernier épisode diffusé', le ? C.episodeLabel(le.season, le.episode) : '—', le && le.airDate ? esc(C.formatDate(le.airDate)) : '') +
        dcol('size', 'Saisons et épisodes', n + ' saison' + (n > 1 ? 's' : '') + (d.numberOfEpisodes ? ' · ' + d.numberOfEpisodes + ' épisodes' : ''), '') +
        dcol('next', 'Prochain épisode', 'Aucun annoncé', sc ? 'Aucun nouvel épisode pour cette série.' : ['Ended', 'Canceled'].includes(d.productionStatus) ? 'La série est terminée.' : 'TMDB n’annonce pas encore de suite.') + sc,
        licenceRowHtml(key), sc ? 4 : 3);
    }
    const c1 = dcol('next', 'Prochain épisode', C.episodeLabel(ne.season, ne.episode), whenHtml(ne.airDate), genericEpName(ne.name) ? '' : '<span class="dcol-sub">' + esc(ne.name) + '</span>');
    let c2, c3;
    if (si && si.total) {
      const pct = Math.round((si.aired / si.total) * 100);
      c2 = dcol('aired', 'Saison ' + si.season, si.started ? si.aired + ' / ' + si.total : si.total + ' épisodes prévus',
        si.started ? 'épisodes diffusés · ' + si.remaining + ' restant' + (si.remaining > 1 ? 's' : '') : 'selon TMDB',
        (si.started ? '<div class="progress-bar" role="progressbar" aria-label="Épisodes diffusés" aria-valuemin="0" aria-valuemax="' + si.total + '" aria-valuenow="' + si.aired + '"><span style="width:' + pct + '%"></span></div>' : '') +
        (lastAired ? '<span class="dcol-sub">' + lastAired + '</span>' : ''));
    } else {
      c2 = dcol('aired', 'Saison ' + ne.season, '', 'Nombre d’épisodes pas encore communiqué', lastAired ? '<span class="dcol-sub">' + lastAired + '</span>' : '');
    }
    if (!si || !si.exact) {
      c3 = dcol('end', 'Dernier épisode prévu', '', !si || !si.listed ? 'Saison pas encore détaillée par TMDB : date inconnue.' : si.loadError ? 'Indisponible (TMDB n’a pas répondu).' : 'Chargement…');
    } else if (si.lastDate) {
      c3 = dcol('end', 'Dernier épisode prévu', 'É' + si.lastNumber + ' · ' + esc(C.formatDate(si.lastDate)), esc(C.relativeDay(si.lastDate, state.today)) + ' · fin de la saison ' + si.season);
    } else {
      c3 = dcol('end', 'Dernier épisode prévu', 'É' + si.lastNumber, 'Date pas encore communiquée' + (si.datedUntil ? ' (dates connues jusqu’à l’É' + si.datedUntil.number + ', ' + esc(C.formatDate(si.datedUntil.date)) + ')' : ''));
    }
    const sc = suiteCol(key);
    return dcard('Diffusion' + (si ? ' · saison ' + si.season : '') + (sc ? ' et suite' : ''), status, c1 + c2 + c3 + sc, licenceRowHtml(key), sc ? 4 : 3);
  }
  function movieLinkCol(id, label, it) {
    const seen = getTrack(it.key) && itemState(it.key).status === 'seen';
    const future = it.date && it.date > state.today;
    return dcol(id, label, '<a href="' + C.detailHash(it.type, it.id) + '">' + esc(it.title) + '</a>',
      it.date ? (future ? whenHtml(it.date) : esc(C.formatDate(it.date))) + (seen ? ' · <span class="accent">✓ vu</span>' : '') : 'Date de sortie inconnue');
  }
  function movieCardHtml(key, d) {
    const future = d.date && d.date > state.today;
    const c1 = dcol('release', future ? 'Sortie prévue' : 'Sortie', d.date ? esc(C.formatDate(d.date)) : 'Date inconnue', future ? whenHtml(d.date) : '',
      '<div class="dcol-avail">' + availHtml(availability(d), key, d.date || '') + '</div>');
    if (!d.collection) {
      return dcard('Sortie', C.productionLabel(d.productionStatus, null, state.today), c1 +
        dcol('runtime', 'Durée', d.runtime ? formatRuntime(d.runtime) : '—', '') +
        dcol('saga', 'Saga', 'Aucune', 'Aucune collection ni suite répertoriée par TMDB.'));
    }
    const c = state.cache.collections.get(d.collection.id);
    const title = 'Sortie et saga « ' + ((c && c.name) || d.collection.name) + ' »';
    if (!c || c.status === 'loading') return dcard(title, '', c1 + dcol('saga', 'Saga', '', 'Chargement de la collection…'));
    if (c.status === 'error') return dcard(title, '', c1 + dcol('saga', 'Saga', '', 'Collection indisponible : ' + esc(c.error.message)));
    const nb = C.collectionNeighbors(c.parts, d.id, state.today);
    return dcard(title, nb.list.length + ' films', c1 +
      (nb.previous ? movieLinkCol('previous', 'Film précédent', nb.previous) : dcol('previous', 'Film précédent', 'Aucun', 'C’est le premier film de la saga.')) +
      (nb.next ? movieLinkCol('following', nb.nextIsUpcoming ? 'Film suivant (à venir)' : 'Film suivant', nb.next) : dcol('following', 'Film suivant', 'Aucun', 'C’est le dernier film connu de la saga.')));
  }
  function recoHtml(key) {
    const d = state.cache.details.get(key);
    if (!d || !d.recommendations.length) return '';
    return '<div class="gallery-head"><h2>Dans le même esprit</h2><span class="hint">Recommandations TMDB : ce ne sont pas des suites officielles.</span></div>' +
      '<div class="rail">' + d.recommendations.map(cardHtml).join('') + '</div>';
  }
  /* Parties de la fiche qui dépendent de données chargées après coup (saison en cours, collection, suivi) : redessinées sur place. */
  function renderRelated() {
    if (state.renderedView !== 'detail' || !state.renderedDetail || !state.renderedDetail.full) return;
    const key = state.route.key;
    const cards = document.getElementById('detail-cards');
    if (cards) cards.innerHTML = detailCardHtml(key);
    const where = document.getElementById('detail-where');
    if (where) where.innerHTML = providersHtml(state.cache.details.get(key));
    const reco = document.getElementById('detail-reco');
    if (reco && !reco.firstChild) { reco.innerHTML = recoHtml(key); }
    checkAvailability();
  }

  /* ----- Éléments permanents : compteurs, statistiques, Reprendre ----- */
  function renderChrome() {
    const s = C.computeStats(state.data);
    const counts = { progress: s.progress, total: s.total, favorites: s.favorites, watchlist: s.watchlist };
    document.querySelectorAll('[data-count]').forEach((el) => { const v = counts[el.dataset.count]; el.textContent = v ? String(v) : ''; });
    byId('stats-panel').innerHTML = [['seen', 'Vu', s.seen, '#library?status=seen', 'Contenus vus'], ['progress', 'En cours', s.progress, '#library?status=progress', 'Contenus en cours'],
      ['fav', 'Favoris', s.favorites, '#favorites', 'Favoris'], ['total', 'Total', s.total, '#library', 'Total personnel : contenus suivis, favoris et watchlist']].map(([c, l, v, h, title]) =>
      '<a class="stat stat-' + c + '" href="' + h + '" data-stat="' + c + '" title="' + title + '"><strong>' + v + '</strong><span>' + l + '</span></a>').join('');
    renderResumeLists();
  }

  /* ----- Mises à jour ciblées (aucune requête réseau) ----- */
  function captureFocus() {
    const el = document.activeElement;
    if (!el || !el.dataset || !el.dataset.action) return null;
    return ['action', 'key', 'season', 'episode', 'status', 'type', 'theme'].filter((k) => el.dataset[k] != null)
      .map((k) => '[data-' + k + '="' + CSS.escape(el.dataset[k]) + '"]').join('');
  }
  function restoreFocus(sel) {
    if (!sel || document.activeElement && document.activeElement !== document.body) return;
    const el = document.querySelector(sel);
    if (el) el.focus({ preventScroll: true }); // le bouton peut légitimement disparaître (ex. « Commencer le suivi »)
  }
  function patchItemUI(key) {
    const st = itemState(key).status;
    const t = getTrack(key);
    document.querySelectorAll('[data-status-for="' + key + '"]').forEach((el) => { el.className = 'status status-' + st; el.textContent = STATUS_LABELS[st]; });
    for (const kind of ['favorite', 'watchlist']) {
      const on = !!(t && t[kind]);
      document.querySelectorAll('[data-action="toggle-' + kind + '"][data-key="' + key + '"]').forEach((b) => { b.setAttribute('aria-pressed', String(on)); b.textContent = toggleLabel(kind, on); });
    }
  }
  /* Ce que la fiche affichée contient réellement (mis à jour à chaque rendu de la fiche) :
     full = en-tête et suivi rendus ; seasons = liste des saisons rendue. Pendant un squelette de chargement, rien n'est à corriger. */
  function detailRenderFlags(key) {
    const full = !!(state.cache.details.get(key) || state.data.metadata[key]);
    return { key, full, seasons: full && C.parseKey(key).type === 'tv' && Array.isArray(viewMeta(key).seasonSummaries) };
  }
  const rendered = (key, part) => state.renderedView === 'detail' && state.renderedDetail && state.renderedDetail.key === key && state.renderedDetail[part];
  function patchTrackBox(key) {
    if (!rendered(key, 'full')) return;
    const f = captureFocus();
    byId('detail-track').innerHTML = trackBoxHtml(key);
    restoreFocus(f);
  }
  function patchSeason(key, n) {
    if (!rendered(key, 'seasons')) return;
    const f = captureFocus();
    byId('season-' + n).outerHTML = seasonHtml(key, n);
    restoreFocus(f);
  }
  function patchDetail(key) {
    if (!rendered(key, 'full')) return;
    patchTrackBox(key);
    if (C.parseKey(key).type === 'tv') {
      const f = captureFocus();
      byId('seasons-section').innerHTML = seasonsHtml(key);
      state.renderedDetail = detailRenderFlags(key);
      restoreFocus(f);
    }
    renderRelated();
  }

  /* ===== Navigation par hash ===== */
  let currentHash = null, pendingTop = false;
  const scrollMemory = new Map();
  function navigate(hash, replace) {
    if (replace) { history.replaceState(null, '', hash); handleRoute(); return; }
    if (location.hash === hash) { handleRoute(); return; }
    pendingTop = true;
    location.hash = hash; // l'événement hashchange appelle handleRoute
  }
  function handleRoute() {
    if (currentHash !== null) scrollMemory.set(currentHash, window.scrollY);
    const hash = location.hash || '#home';
    const route = C.parseRoute(hash);
    state.route = route;
    state.today = todayIso();
    detailToken++; // un chargement de fiche précédent ne s'affichera plus
    if (route.name === 'detail') {
      state.ui.detail = { key: route.key, status: state.cache.details.has(route.key) ? 'ready' : 'loading', error: null };
      if (route.type === 'tv' && (state.cache.details.has(route.key) || state.data.metadata[route.key])) expandedSeasons(route.key);
    }
    if (route.name === 'search') {
      const q = (route.params.q || '').trim().slice(0, 120);
      const f = C.parseSearchFilters(route.params);
      const s = state.ui.search;
      if (q !== s.q || !C.sameFilters(f, s.filters) || s.status === 'error') startSearch(q, f, 1);
      const input = byId('search-input');
      if (document.activeElement !== input && input.value.trim() !== q) input.value = q;
    }
    currentHash = hash;
    document.querySelectorAll('[data-nav]').forEach((a) => {
      const on = a.dataset.nav === route.name || (a.dataset.navGroup || '').split(' ').includes(route.name);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    renderView();
    renderRelated();
    window.scrollTo(0, pendingTop || !scrollMemory.has(hash) ? 0 : scrollMemory.get(hash));
    pendingTop = false;
    if (route.name === 'home' && tmdbReady()) HOME_SECTIONS.forEach((sec) => loadHomeSection(sec, false));
    else if (route.name === 'detail') loadDetail(route, false);
    else if (route.name === 'agenda') loadAgenda(false);
    else if (route.name === 'stats') fillRuntimes();
    else if (route.name === 'saga' && C.findSaga(route.sagaId) && tmdbReady()) loadSaga(C.findSaga(route.sagaId), C.parseSagaParams(route.params).extra);
  }
  function renderView() {
    const r = state.route;
    let html, title;
    switch (r.name) {
      case 'home': html = homeHtml(); title = 'Accueil'; break;
      case 'search': html = searchHtml(); title = state.ui.search.q ? 'Recherche « ' + state.ui.search.q + ' »' : state.ui.search.mode === 'discover' ? 'Découvrir' : 'Recherche'; break;
      case 'detail': html = detailHtml(); title = ((state.cache.details.get(r.key) || state.data.metadata[r.key] || {}).title) || 'Fiche'; break;
      case 'resume': html = resumePageHtml(); title = 'Reprendre'; break;
      case 'library': case 'favorites': case 'watchlist': html = listPageHtml(r.name); title = LIST_TITLES[r.name][0]; break;
      case 'settings': html = settingsHtml(); title = 'Réglages'; break;
      case 'sagas': html = sagasHtml(); title = 'Sagas'; break;
      case 'agenda': html = agendaHtml(); title = 'À venir'; break;
      case 'stats': html = statsHtml(); title = 'Statistiques'; break;
      case 'saga': { const sg = C.findSaga(r.sagaId); html = sagaHtml(); title = sg ? sg.name : 'Saga introuvable'; break; }
      case 'invalid': html = notFoundHtml('Lien de fiche invalide', 'Le type ou l’identifiant de ce lien n’est pas reconnu (attendu : #detail/movie/123 ou #detail/tv/123).'); title = 'Lien invalide'; break;
      default: html = notFoundHtml('Page introuvable', 'Cette adresse ne correspond à aucune page de Crazy Liste.'); title = 'Page introuvable';
    }
    const f = captureFocus();
    byId('view-root').innerHTML = html;
    state.renderedView = r.name;
    state.renderedDetail = r.name === 'detail' ? detailRenderFlags(r.key) : null;
    if (r.name === 'resume') renderResumeLists();
    document.title = title + ' · Crazy Liste';
    restoreFocus(f);
    checkAvailability();
  }
  function renderAll() { applyTheme(); renderBanners(); renderView(); renderRelated(); renderChrome(); }

  /* ===== Événements (délégation) ===== */
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (link && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey && link.getAttribute('href') !== location.hash) pendingTop = true;
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (!fn) throw new Error('Action inconnue : ' + el.dataset.action);
    e.preventDefault();
    Promise.resolve(fn(el, e)).catch((err) => { console.error(err); toast('Erreur inattendue : ' + err.message, 'error'); });
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'import-file') { const f = el.files && el.files[0]; el.value = ''; if (f) importFile(f); return; }
    if (el.dataset.change === 'only-available') { setOnlyAvailable(el.checked); return; }
    if (el.dataset.change === 'search-filter') {
      const f = C.parseSearchFilters(Object.assign({}, state.ui.search.filters, { [el.dataset.filter]: el.value.trim() }));
      navigate(searchHash(state.ui.search.q, f), true);
      return;
    }
    if (el.dataset.change === 'lib-type') { state.data.preferences.libraryType = el.value; persist(); renderView(); }
    if (el.dataset.change === 'lib-sort') { state.data.preferences.librarySort = el.value; persist(); renderView(); }
  });
  document.addEventListener('error', (e) => { if (e.target instanceof HTMLImageElement) e.target.remove(); }, true); // affiche est remplacée par le titre
  const searchInput = byId('search-input');
  function submitSearch() {
    const q = searchInput.value.trim();
    navigate(searchHash(q, state.ui.search.filters), state.route.name === 'search');
  }
  byId('search-form').addEventListener('submit', (e) => { e.preventDefault(); clearTimeout(searchTimer); submitSearch(); });
  searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(submitSearch, 350); });
  document.addEventListener('keydown', (e) => { // « / » : aller à la recherche depuis n'importe quelle page
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement || t instanceof HTMLSelectElement || (t && t.isContentEditable)) return;
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  });
  byId('lightbox').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.classList.contains('lb-figure')) e.currentTarget.close(); }); // clic à côté de l'image
  byId('lightbox').addEventListener('close', () => { byId('lightbox-img').removeAttribute('src'); });
  byId('lightbox').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepLightbox(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); stepLightbox(1); }
  });
  let touchX = null; // balayage sur téléphone
  byId('lightbox').addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  byId('lightbox').addEventListener('touchend', (e) => { if (touchX == null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1); });
  byId('trailer-dialog').addEventListener('close', () => { byId('trailer-frame').replaceChildren(); }); // arrête la lecture
  byId('trailer-dialog').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); }); // clic hors de la vidéo
  byId('app-dialog').addEventListener('close', () => { const r = dialogResolve; dialogResolve = null; if (r) r(byId('app-dialog').returnValue || 'cancel'); });
  window.addEventListener('hashchange', handleRoute);
  window.addEventListener('storage', (e) => {
    if (e.key !== D.STORAGE_KEY || e.newValue == null) return;
    let parsed;
    try { parsed = JSON.parse(e.newValue); } catch (err) { return; }
    state.data = D.sanitizeData(parsed).data;
    renderAll();
  });

  /* ===== Démarrage ===== */
  state.today = todayIso();
  state.data = loadData();
  for (const t of Object.values(state.data.tracking)) if (t.lastActivityAt > lastStamp) lastStamp = t.lastActivityAt;
  applyTheme();
  renderBanners();
  handleRoute();
  renderChrome();
  refreshStaleMetadata();
  initSync();
})();
</script>
</body>
</html>
