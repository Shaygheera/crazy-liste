<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#333}
img{display:block}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.frame{position:relative;width:1440px;overflow:hidden;margin-bottom:40px;font:400 14.5px/1.5 "DM Sans",sans-serif;letter-spacing:-.005em;
  --r-top:#22c55e;--r-good:#84cc16;--r-mid:#eab308;--r-none:#6b7280;--fav:#ff5c8a;--wl:#9b87f5}
.frame.home{height:960px}
.dark{--bg:#07080b;--fg:#f6f7f9;--fg2:rgba(246,247,249,.74);--mut:rgba(246,247,249,.52);--line:rgba(255,255,255,.08);
  --glass:rgba(20,22,28,.52);--glass-2:rgba(255,255,255,.06);--glass-b:rgba(255,255,255,.1);--hi:inset 0 1px 0 rgba(255,255,255,.07);
  --seen:#34d399;--prog:#fbbf24;--todo:rgba(246,247,249,.55);--pri-bg:#fff;--pri-fg:#0a0a0a;--amb:.42;background:var(--bg);color:var(--fg)}
.light{--bg:#f3f3f6;--fg:#0b0c10;--fg2:rgba(11,12,16,.72);--mut:rgba(11,12,16,.5);--line:rgba(0,0,0,.07);
  --glass:rgba(255,255,255,.62);--glass-2:rgba(255,255,255,.7);--glass-b:rgba(0,0,0,.07);--hi:inset 0 1px 0 rgba(255,255,255,.9);
  --seen:#059669;--prog:#d97706;--todo:rgba(11,12,16,.5);--pri-bg:#0b0c10;--pri-fg:#fff;--amb:.32;background:var(--bg);color:var(--fg)}
/* fond d'ambiance : l'image du titre, très floue, colore la page */
.amb{position:absolute;inset:-160px;background-size:cover;background-position:center;filter:blur(110px) saturate(1.6);opacity:var(--amb);z-index:0;pointer-events:none}
.light .amb{filter:blur(110px) saturate(1.4) brightness(1.5)}
.amb-fade{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(transparent,var(--bg));z-index:0}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr) 296px;gap:14px;padding:14px;min-height:100%}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--hi),0 10px 40px rgba(0,0,0,.18);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%)}
.ico{width:18px;height:18px;flex:none}
/* navigation flottante */
.nav{border-radius:26px;padding:18px 12px;display:flex;flex-direction:column;align-self:start;height:calc(960px - 28px);position:sticky;top:14px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 0}
.mark{width:34px;height:34px;border-radius:11px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.04em}
.brand b{display:block;font-weight:700;font-size:16px;letter-spacing:-.025em}.brand small{display:block;font-size:12px;color:var(--mut);margin-top:-1px}
.ng{margin-top:22px;display:grid;gap:2px}.ng p{margin:0 0 4px 12px;font-size:12px;font-weight:500;color:var(--mut)}
.ng a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:13px;color:var(--fg2);font-weight:500;font-size:14.5px;text-decoration:none}
.ng a .ico{opacity:.85}
.ng a.on{background:var(--glass-2);color:var(--fg);font-weight:600;box-shadow:var(--hi)}
.dark .ng a.on{background:rgba(255,255,255,.1)}
.ng a span{margin-left:auto;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.nfoot{margin-top:auto;display:grid;gap:2px}.nfoot a{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:12px;color:var(--fg2);font-weight:500;font-size:14px}
.sync{display:flex;align-items:center;gap:9px;margin:8px 4px 0;padding:10px 12px;border-radius:14px;background:var(--glass-2);font-size:12.5px;color:var(--fg2)}.sync i{width:8px;height:8px;border-radius:50%;background:var(--seen);box-shadow:0 0 0 3px color-mix(in srgb,var(--seen) 25%,transparent)}
/* haut */
main{min-width:0;padding:0 14px}
.top{display:flex;align-items:center;gap:12px;height:58px}
.search{flex:1;max-width:560px;height:46px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 6px 0 18px;color:var(--mut);font-size:14.5px}
.search kbd{margin-left:auto;font:600 11.5px "DM Sans";color:var(--mut);background:var(--glass-2);border-radius:7px;padding:2px 7px}
.search .go{height:34px;padding:0 16px;border-radius:999px;background:var(--pri-bg);color:var(--pri-fg);font-weight:600;font-size:13.5px}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 0 18px}
.head h1{margin:0;font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1}
.head p{margin:8px 0 0;color:var(--fg2);font-size:14.5px}
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;color:var(--fg2);padding:8px 8px 8px 14px;border-radius:999px}
.switch i{width:40px;height:24px;border-radius:999px;background:var(--glass-2);position:relative;box-shadow:inset 0 0 0 1px var(--glass-b)}.switch i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* bandeau Reprendre */
.spot{position:relative;height:280px;border-radius:28px;overflow:hidden;margin-bottom:30px}
.spot>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.spot::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,9,.9) 0%,rgba(5,6,9,.55) 45%,rgba(5,6,9,0) 75%)}
.spot .in{position:absolute;z-index:1;left:32px;bottom:28px;right:40%;color:#fff}
.spot .k{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px}
.spot .logo{width:250px;margin:12px 0 14px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.spot .meta{font-size:13.5px;color:rgba(255,255,255,.82)}
.spot .pb{height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:12px 0 16px;max-width:360px;overflow:hidden}.spot .pb i{display:block;height:100%;background:#fbbf24;border-radius:9px}
.spot .row{display:flex;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px}
.pill.pri{background:var(--pri-bg);color:var(--pri-fg)}.spot .pill.pri{background:#fff;color:#0a0a0a}
.pill.gl{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
/* rangées */
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.rh h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.03em}
.arr{display:flex;gap:8px}.arr b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:172px;gap:20px;overflow:hidden}
.poster{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px -12px rgba(0,0,0,.55),0 0 0 1px var(--line)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.rate{position:absolute;left:9px;top:9px;z-index:2;height:24px;min-width:38px;padding:0 8px;border-radius:9px;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;color:#0a0a0a;font-variant-numeric:tabular-nums}
.r-top{background:var(--r-top)}.r-good{background:var(--r-good)}.r-mid{background:var(--r-mid)}.r-none{background:rgba(20,20,24,.7);color:#fff;backdrop-filter:blur(10px)}
.tag{position:absolute;right:9px;top:9px;z-index:2;height:24px;padding:0 9px;border-radius:9px;display:inline-grid;place-items:center;font-weight:600;font-size:11.5px;color:#fff;background:rgba(20,20,24,.5);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.av{position:absolute;left:9px;bottom:14px;z-index:2;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#fff}
.av i{width:7px;height:7px;border-radius:50%;background:#34d399}.av.soon i{background:#fbbf24}
.pbar{position:absolute;left:9px;right:9px;bottom:7px;z-index:2;height:3px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}.pbar i{display:block;height:100%;border-radius:9px}
.card h3{margin:12px 0 0;font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta2{margin:1px 0 0;font-size:13px;color:var(--mut)}
.st{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:13px;font-weight:600;white-space:nowrap}
.st svg{width:15px;height:15px}.st .n{color:var(--fg2);font-weight:500}
.st-prog{color:var(--prog)}.st-seen{color:var(--seen)}.st-todo{color:var(--todo)}
.syn{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;margin-top:12px}
.acts button{flex:1;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg2);background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-b)}
.acts .ico{width:15px;height:15px}
.acts .fav.on{color:var(--fav);background:color-mix(in srgb,var(--fav) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fav) 35%,transparent)}
.acts .wl.on{color:var(--wl);background:color-mix(in srgb,var(--wl) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wl) 35%,transparent)}
/* panneau droit flottant */
.side{border-radius:26px;padding:20px 18px;align-self:start;position:sticky;top:14px}
.side h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-size:16px;font-weight:700;letter-spacing:-.025em}
.side h2 a{font-size:13px;font-weight:600;color:var(--mut)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 26px}
.bento div{border-radius:18px;padding:14px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-b)}
.bento strong{display:block;font-size:28px;font-weight:700;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.bento span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2);font-weight:500;margin-top:2px}
.bento span i{width:7px;height:7px;border-radius:50%}
.rrow{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:8px;margin:0 -8px;border-radius:16px}
.rrow:first-of-type{margin-top:8px}.rrow.on{background:var(--glass-2)}
.rrow img{width:44px;aspect-ratio:2/3;object-fit:cover;border-radius:9px}
.rrow strong{font-size:14px;font-weight:600;letter-spacing:-.015em}.rrow small{display:block;font-size:12.5px;color:var(--mut);margin:1px 0 7px}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--prog);border-radius:9px}
/* ===== fiche ===== */
.hero{position:relative;border-radius:30px;overflow:hidden;margin-top:6px;min-height:430px}
.hero>img.bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,9,.92) 0%,rgba(5,6,9,.7) 42%,rgba(5,6,9,.1) 80%),linear-gradient(0deg,rgba(5,6,9,.75),transparent 55%)}
.hin{position:relative;z-index:1;display:grid;grid-template-columns:184px minmax(0,1fr);gap:30px;padding:30px;color:#fff}
.hpost{width:184px;border-radius:18px;box-shadow:0 24px 50px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12)}
.licbtn{margin-top:12px;width:184px;text-align:left;border-radius:16px;padding:10px 12px;color:#fff;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px;line-height:1.25}
.licbtn small{display:block;font-weight:500;font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}.licbtn .ico{margin-left:auto;opacity:.7}
.htext{align-self:end}
.hlogo{width:330px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));margin-bottom:16px}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px;color:rgba(255,255,255,.85)}
.hmeta .rate{position:static}.hmeta .sep{opacity:.4}
.hmeta .st{margin:0}.hero .st-prog{color:#fcd34d}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px}.chips span{height:28px;padding:0 12px;border-radius:999px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);color:rgba(255,255,255,.9)}
.hact{display:flex;gap:10px}
.hero .pill.pri{background:#fff;color:#0a0a0a}.hero .pill.fav{color:#ff8fb0;background:rgba(255,92,138,.2);box-shadow:inset 0 0 0 1px rgba(255,92,138,.4)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}
.tile{border-radius:24px;padding:18px 20px}
.tile h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between}
.tile h2 em{font-style:normal;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--glass-2);color:var(--fg2);box-shadow:inset 0 0 0 1px var(--glass-b)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.dgrid div{border-radius:16px;padding:12px 14px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-b)}
.dgrid small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.dgrid strong{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.15}
.dgrid span{font-size:12.5px;color:var(--fg2)}
.provs{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--mut)}
.prov{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 5px;border-radius:999px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-b);color:var(--fg);font-weight:600}.prov img{width:26px;height:26px;border-radius:50%}
.provs a{margin-left:auto;color:var(--fg2);font-weight:600}
.res{margin:10px 0 0;font-size:15.5px;line-height:1.6;color:var(--fg2)}
.prog{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center;margin-top:14px}
.ring{position:relative;width:96px;height:96px}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.04em;line-height:1}.ring b small{display:block;font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:0;margin-top:3px}
.ticks{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin:10px 0 8px}.ticks i{height:8px;border-radius:9px;background:var(--line)}.ticks i.s{background:var(--seen)}.ticks i.n{background:var(--prog)}
.prog p{margin:0;font-size:13.5px;color:var(--fg2)}.prog p b{color:var(--fg)}
.tacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tacts button{height:34px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--fg2);background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-b);display:flex;align-items:center;gap:6px}
.tacts .danger{color:#f87171}
.seasons{margin-top:30px}
.seasons>header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.seasons>header h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.03em}.seasons>header p{margin:0;font-size:13px;color:var(--mut)}
.season{border-radius:24px;padding:14px 16px;margin-bottom:10px}
.shead{display:flex;align-items:center;gap:14px}
.shead h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;min-width:120px}
.shead .m{flex:1;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:10px}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-b)}
.seg span{height:28px;padding:0 12px;border-radius:999px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--fg2);white-space:nowrap}
.seg span.on.v{background:var(--seen);color:#04140c}.seg span.on.p{background:var(--prog);color:#1a1000}.seg span.on.t{background:var(--fg);color:var(--bg)}
.sbar{height:4px;border-radius:9px;background:var(--line);margin-top:12px;overflow:hidden}.sbar i{display:block;height:100%;border-radius:9px}
.eps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.ep{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px 10px 10px;border-radius:18px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-b)}
.ep .no{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--line);color:var(--fg2)}
.ep.s .no{background:color-mix(in srgb,var(--seen) 18%,transparent);color:var(--seen)}
.ep.next{box-shadow:inset 0 0 0 1.5px var(--prog)}.ep.next .no{background:var(--prog);color:#1a1000}
.ep h4{margin:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ep .em{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap}
.ep .em .rate{position:static;height:19px;min-width:30px;font-size:11px;border-radius:6px;padding:0 5px}
.nx{font-size:11px;font-weight:700;color:var(--prog)}
.ep .seg span{height:24px;padding:0 9px;font-size:11.5px}
.frame.home{height:1010px}.nav{height:982px}
.switch{white-space:nowrap;flex:none}.head>div{min-width:0;max-width:62%}
.ring b{display:flex;flex-direction:column;align-items:center;justify-content:center}
.ep>div{min-width:0;overflow:hidden}
.hmeta2{font-size:14px;color:rgba(255,255,255,.82);margin-top:10px}
.licbtn{font-size:13px}
.grid2{grid-template-columns:1.5fr 1fr}

<script>
