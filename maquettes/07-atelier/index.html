<style>
/* Atelier : une table lumineuse neutre pour regarder des maquettes, sans couleur propre qui ferait concurrence aux designs. */
:root{--a-bg:#ececef;--a-panel:#fff;--a-fg:#141418;--a-fg2:#45454e;--a-mut:#686873;--a-line:#d6d6dc;--a-acc:#141418;--a-accfg:#fff;--a-pick:#c81d5e;--a-stage:#d9d9de;

:root[data-theme="dark"]{--a-bg:#121215;--a-panel:#1b1b20;--a-fg:#f1f1f4;--a-fg2:#c3c3cb;--a-mut:#9a9aa5;--a-line:#2e2e36;--a-acc:#f1f1f4;--a-accfg:#121215;--a-pick:#ff6b9d;--a-stage:#0a0a0c;color-scheme:dark}

.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1500px;margin:0 auto}
.app button,.app select{font:inherit;color:inherit}
.app :focus-visible{outline:2px solid var(--a-pick);outline-offset:2px}
.ah{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.ah h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.ah p{margin:6px 0 0;color:var(--a-fg2);max-width:70ch}
.picked{font-size:14px;color:var(--a-fg2)}.picked b{color:var(--a-pick)}
.tabs{display:flex;gap:8px;padding:4px;border-radius:10px;background:var(--a-panel);box-shadow:inset 0 0 0 1px var(--a-line);width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.tabs a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:7px;color:var(--a-fg2);font-weight:600;text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--a-acc);color:var(--a-accfg)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
.filters button{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--a-line);background:var(--a-panel);font-size:13.5px;font-weight:600;cursor:pointer;color:var(--a-fg2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}

.pcb{display:grid;gap:4px;padding:12px 14px 14px}.pcb p{margin:0}
.pct{display:flex;align-items:baseline;gap:8px}

.stagewrap{border-radius:10px;overflow:hidden;background:var(--a-stage);box-shadow:inset 0 0 0 1px var(--a-line)}
.stage{zoom:var(--z,1);width:1280px}
.stage.old{width:1440px}

.stage.old figcaption{font:600 26px/1.3 var(--a-f);padding:16px 20px;color:var(--a-fg);background:var(--a-panel)}

.dbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.dbar h2{margin:0;font-size:22px;letter-spacing:-.02em}

.note{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--a-panel);box-shadow:inset 0 0 0 1px var(--a-line);font-size:13.5px;color:var(--a-fg2)}
.note b{color:var(--a-fg)}
.sets{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;color:var(--a-fg2)}.sets b{color:var(--a-fg)}
.sets button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--a-line);background:var(--a-panel);font-size:13.5px;font-weight:600;cursor:pointer;color:var(--a-fg2)}
.sets button[aria-pressed="true"]{background:var(--a-acc);color:var(--a-accfg);border-color:var(--a-acc)}
.sets small{flex-basis:100%;color:var(--a-mut);font-size:13px}
.kbd{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--a-mut)}.kbd kbd{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:6px;border:1px solid var(--a-line);border-bottom-width:2px;background:var(--a-panel);font:600 12.5px var(--a-f);color:var(--a-fg)}
.pane h3{align-items:center}.pane h3 #ha,.pane h3 #hb{font-weight:700;font-size:15px;color:var(--a-fg)}.pane h3 .pn{margin-left:auto;display:flex;gap:8px}.pane h3 .pn .ab{width:44px;padding:0;justify-content:center}
@media (hover:none){.kbd{display:none}}
.cmpbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:12px}
.cmpbar label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--a-fg2);min-width:0}
.cmpbar select{min-height:44px;padding:0 10px;border-radius:8px;border:1px solid var(--a-line);background:var(--a-panel);width:100%;font-size:14.5px}
.cmpopts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 12px;font-size:14px;color:var(--a-fg2)}
.cmpopts label{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.cmpopts input{width:18px;height:18px;accent-color:var(--a-pick)}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{display:grid;grid-template-rows:auto 1fr;min-width:0}
.pane h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:baseline}.pane h3 span{font-weight:500;color:var(--a-mut);font-size:13px}
.pane .stagewrap{height:min(78vh,1100px);overflow:auto}
@media (max-width:760px){.panes{grid-template-columns:1fr}.pane .stagewrap{height:70vh}.cmpbar{grid-template-columns:1fr}.cmpbar .ab{justify-self:start}.thumb{height:200px}}
@media (prefers-reduced-motion:no-preference){.pc{transition:box-shadow .15s}.ab,.tabs a{transition:background .15s,color .15s}}
</style>

<div class="app">
  <header class="ah">
    <div><h1>Atelier Crazy Liste</h1>
      <p>Dix-huit nouvelles propositions sur la même fiche d’Arcane, les anciennes maquettes et le site actuel. Ouvre une proposition en grand, marque celles qui te plaisent, puis compare-les deux par deux.</p></div>

(function () {

const M = {"00-site-actuel":[["01-accueil",1440,3451],["02-fiche-serie",1440,2174],["03-fiche-film",1440,1378],["04-recherche",1440,1431],["05-bibliotheque",1440,1317],["06-reprendre",1440,900],["07-a-venir",1440,900],["08-statistiques",1440,900],["09-licences",1440,900],["10-licence-mcu",1440,3121],["11-reglages",1440,1105],["12-fenetre-licence",1440,900],["13-fiche-theme-clair",1440,1709],["14-accueil-theme-clair",1440,900],["15-mobile-fiche",390,2817]],"01-streaming-rejetee":[["maquette-1",1440,1434],["maquette-2",1440,956]],"02-suivi":[["suivi-1",1440,1335],["suivi-2",1440,834],["suivi-3",1440,1276]],"03-refonte-suisse":[["01-accueil",1440,3419],["02-fiche-serie",1440,2211],["03-fiche-film",1440,1415],["04-recherche",1440,1405],["05-bibliotheque",1440,1276],["06-reprendre",1440,900],["07-a-venir",1440,900],["08-statistiques",1440,900],["09-licences",1440,900],["10-licence-mcu",1440,3226],["11-reglages",1440,1231],["12-fenetre-licence",1440,900],["13-fiche-theme-clair",1440,1737],["14-accueil-theme-clair",1440,900],["15-mobile-fiche",390,2846]],"04-trois-directions":[["d-1",1440,900],["d-2",1440,1231],["d-3",1440,901],["d-4",1440,1210],["d-5",1440,901],["d-6",1440,1564]],"05-immersive-v1":[["m-1",1440,1010],["m-2",1440,1377],["m-3",1440,1011],["m-4",1440,1378]],"06-immersive-v2":[["m-1",1440,1000],["m-2",1440,1091],["m-3",1440,1000],["m-4",1440,1091]]};

const ro = new ResizeObserver((entries) => entries.forEach((en) => { const st = en.target.querySelector(':scope > .stage'); if (st) st.style.setProperty('--z', (en.contentRect.width / (st.classList.contains('old') ? 1440 : 1280)).toFixed(4)); }));
const watch = (root) => root.querySelectorAll('.thumb,.stagewrap').forEach((w) => ro.observe(w));
const stageNew = (d) => '<div class="stage">' + R(d) + '</div>';
const stageOld = (o) => '<div class="stage old">' + M[o.dir].filter(([n, w]) => w > 400).map(([n]) => '<figure><figcaption>' + (CAP[n] || n) + '</figcaption><img loading="lazy" src="img/' + o.dir + '/' + n + '.webp" alt="' + o.n + ' : ' + (CAP[n] || n) + '"></figure>').join('') + '</div>';
const pickBtn = (k) => '<button class="ab" data-pick="' + k + '" aria-pressed="' + picked.includes(k) + '">' + svg('star') + (picked.includes(k) ? 'Retenue' : 'Retenir') + '</button>';
const cmpBtn = (k) => '<button class="ab" data-cmp="' + k + '">' + svg('cols') + 'Comparer</button>';

let filter = 'Toutes';
function galerie() {
  const keep = window.CL_EPSET; window.CL_EPSET = 'arcane';
  const F = ['Toutes', 'Sombre', 'Clair', 'Sans arrondi', 'Retenues'];
  const list = D.filter((d) => filter === 'Toutes' || (filter === 'Retenues' ? picked.includes('n' + d.id) : filter === 'Sans arrondi' ? ['01', '01b', '04', '10'].includes(d.id) : d.th === filter));
  view.innerHTML = '<div class="filters" role="group" aria-label="Filtrer">' + F.map((f) => '<button data-f="' + f + '" aria-pressed="' + (f === filter) + '">' + f + '</button>').join('') + '</div>' +
    '<div class="grid">' + (list.length ? list.map((d) => '<article class="pc' + (picked.includes('n' + d.id) ? ' is-picked' : '') + '"><div class="thumb" role="link" tabindex="0" data-open="p-' + d.id + '" aria-label="Voir ' + d.n + ' en grand">' + stageNew(d) + '</div>' +
      '<div class="pcb"><p class="pct"><span>' + d.id + '</span><b>' + d.n + '</b></p><p class="pcm">' + d.style + ' · ' + d.lay + ' · ' + d.font + '</p><p class="pcd">' + d.d + '</p>' +
      '<div class="pca"><a class="ab pri" href="#p-' + d.id + '">Voir en grand</a>' + pickBtn('n' + d.id) + cmpBtn('n' + d.id) + '</div></div></article>').join('') : '<p>Aucune proposition retenue pour l’instant.</p>') + '</div>';
  window.CL_EPSET = keep;
  watch(view);
}
function anciennes() {
  view.innerHTML = '<div class="grid">' + OLD.map((o) => { const c = M[o.dir][o.cover - 1][0]; return '<article class="pc' + (picked.includes(o.id) ? ' is-picked' : '') + '"><div class="thumb" role="link" tabindex="0" data-open="a-' + o.id + '" aria-label="Voir ' + o.n + '"><img loading="lazy" src="img/' + o.dir + '/' + c + '.webp" alt=""></div>' +
    '<div class="pcb"><p class="pct"><b>' + o.n + '</b><span>' + M[o.dir].length + ' captures</span></p><p class="pcd">' + o.a + '</p><div class="pca"><a class="ab pri" href="#a-' + o.id + '">Voir les captures</a>' + pickBtn(o.id) + cmpBtn(o.id) + '</div></div></article>'; }).join('') + '</div>';
}
function detailNew(id) {
  const i = D.findIndex((d) => d.id === id), d = D[i];
  if (!d) return galerie();
  const prev = D[(i + D.length - 1) % D.length], next = D[(i + 1) % D.length];
  view.innerHTML = '<div class="dbar"><a class="ab" href="#galerie">' + svg('left') + 'Galerie</a><div class="grow"><h2>' + d.id + ' · ' + d.n + '</h2><p>' + d.style + ' · ' + d.lay + ' · police ' + d.font + ' · thème ' + d.th.toLowerCase() + '</p></div>' +
    pickBtn('n' + d.id) + cmpBtn('n' + d.id) + '<a class="ab" href="#p-' + prev.id + '">' + svg('left') + prev.id + '</a><a class="ab" href="#p-' + next.id + '">' + next.id + svg('chevr') + '</a></div>' +
    setsBar() + '<p class="kbd" style="margin:0 0 10px"><kbd>←</kbd><kbd>→</kbd>proposition précédente / suivante</p><div class="stagewrap">' + stageNew(d) + '</div>' +
    '<p class="note"><b>' + d.d + '</b><br>Mêmes infos que le site sur chaque proposition : note TMDB colorée, disponibilité, statut, progression par épisode, Favori / Watchlist, boutons Saga et Licence sous l’affiche, diffusion, offres, résumé, saisons et épisodes (À voir / En cours / Vu, Vu jusqu’ici), prochain épisode, Mes statistiques et Reprendre. Contrôlé avec le skill UI/UX Pro Max et un script de mesure : contraste du texte mesuré sur les pixels réels du fond (4,5:1 au moins, 3:1 pour les grands titres), toutes les cibles cliquables à 44 px au moins avec 8 px d’écart, texte à 12 px au moins, statut toujours écrit avec une icône, icônes SVG, contour visible au clavier. Résultat : 0 écart sur toutes les propositions.</p>';
  watch(view);
}
function detailOld(id) {
  const i = OLD.findIndex((x) => x.id === id), o = OLD[i];
  if (!o) return anciennes();
  const prev = OLD[(i + OLD.length - 1) % OLD.length], next = OLD[(i + 1) % OLD.length];
  view.innerHTML = '<div class="dbar"><a class="ab" href="#anciennes">' + svg('left') + 'Anciennes</a><div class="grow"><h2>' + o.n + '</h2><p>' + o.a + '</p></div>' + pickBtn(o.id) + cmpBtn(o.id) +
    '<a class="ab" href="#a-' + prev.id + '" aria-label="Précédente : ' + prev.n + '">' + svg('left') + '</a><a class="ab" href="#a-' + next.id + '" aria-label="Suivante : ' + next.n + '">' + svg('chevr') + '</a></div>' +
    '<p class="kbd" style="margin:0 0 10px"><kbd>←</kbd><kbd>→</kbd>proposition précédente / suivante</p><div class="stagewrap">' + stageOld(o) + '</div>';
  watch(view);
}
const opts = () => '<optgroup label="Nouvelles propositions">' + D.map((d) => '<option value="n' + d.id + '">' + d.id + ' · ' + d.n + '</option>').join('') + '</optgroup><optgroup label="Anciennes et site actuel">' + OLD.map((o) => '<option value="' + o.id + '">' + o.n + '</option>').join('') + '</optgroup>';
const ALL = D.map((d) => 'n' + d.id).concat(OLD.map((o) => o.id));
let stepCmp = null;
const paneHtml = (k) => { const d = D.find((x) => 'n' + x.id === k); if (d) return stageNew(d); const o = OLD.find((x) => x.id === k) || OLD[0]; return stageOld(o); };
const paneSub = (k) => { const d = D.find((x) => 'n' + x.id === k); if (d) return d.style + ' · ' + d.lay; const o = OLD.find((x) => x.id === k); return o ? o.a : ''; };
function comparer() {
  view.innerHTML = '<div class="cmpbar"><label for="ca">À gauche<select id="ca">' + opts() + '</select></label><button class="ab" id="swap" aria-label="Inverser les deux côtés">' + svg('swap') + 'Inverser</button><label for="cb">À droite<select id="cb">' + opts() + '</select></label></div>' +
    '<div class="cmpopts"><label><input type="checkbox" id="sync"' + (cmp.sync ? ' checked' : '') + '>Défilement lié</label><span class="kbd"><kbd>←</kbd><kbd>→</kbd>change la droite · <kbd>Maj</kbd>+<kbd>←</kbd><kbd>→</kbd>change la gauche</span></div>' + setsBar() +
    '<div class="panes">' + ['a', 'b'].map((x) => '<section class="pane"><h3><span id="h' + x + '"></span><span class="pn"><button class="ab" data-step="' + x + ':-1" aria-label="Précédente">' + svg('left') + '</button><button class="ab" data-step="' + x + ':1" aria-label="Suivante">' + svg('chevr') + '</button></span></h3><div class="stagewrap" id="p' + x + '"></div></section>').join('') + '</div>';
  $('#ca').value = cmp.a; $('#cb').value = cmp.b;
  const fill = (side) => { const k = cmp[side], pane = $('#p' + side), top = pane.scrollTop; pane.innerHTML = paneHtml(k); const st = pane.querySelector('.stage'); st.style.setProperty('--z', (pane.clientWidth / (st.classList.contains('old') ? 1440 : 1280)).toFixed(4)); pane.scrollTop = top; $('#h' + side).innerHTML = nameOf(k) + ' <span>' + paneSub(k) + '</span>'; $('#c' + side).value = k; };
  refillCmp = () => { fill('a'); fill('b'); };
  stepCmp = (side, dir) => { const i = ALL.indexOf(cmp[side]); cmp[side] = ALL[(i + dir + ALL.length) % ALL.length]; saveCmp(); fill(side); };
  fill('a'); fill('b'); watch(view);
  $('#ca').onchange = (e) => { cmp.a = e.target.value; saveCmp(); fill('a'); };
  $('#cb').onchange = (e) => { cmp.b = e.target.value; saveCmp(); fill('b'); };
  $('#swap').onclick = () => { [cmp.a, cmp.b] = [cmp.b, cmp.a]; saveCmp(); comparer(); };
  $('#sync').onchange = (e) => { cmp.sync = e.target.checked; saveCmp(); };
  const pa = $('#pa'), pb = $('#pb'); let lock = false;
  const link = (from, to) => from.addEventListener('scroll', () => { if (!cmp.sync || lock) return; lock = true; const r = from.scrollTop / Math.max(1, from.scrollHeight - from.clientHeight); to.scrollTop = r * (to.scrollHeight - to.clientHeight); requestAnimationFrame(() => { lock = false; }); });
  link(pa, pb); link(pb, pa);
}
function route() {
  const h = (location.hash || '#galerie').slice(1);
  const v = h.startsWith('p-') ? 'galerie' : h.startsWith('a-') ? 'anciennes' : ['galerie', 'anciennes', 'comparer'].includes(h) ? h : 'galerie';
  document.querySelectorAll('.tabs a').forEach((a) => a.setAttribute('aria-current', a.dataset.v === v ? 'page' : 'false'));
  ro.disconnect();
  if (h.startsWith('p-')) detailNew(h.slice(2)); else if (h.startsWith('a-')) detailOld(h.slice(2)); else if (v === 'anciennes') anciennes(); else if (v === 'comparer') comparer(); else galerie();
  showPicked();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-pick],[data-cmp],[data-open],[data-f],[data-step],[data-set],.dz a,.dz button');
  if (!t) return;
  if (t.closest('.dz') && !t.dataset.open) { e.preventDefault(); window.CL_epClick(t); return; }
  if (t.dataset.set) {
    window.CL_EPSET = t.dataset.set; try { localStorage.setItem('cl-epset', t.dataset.set); } catch (er) {}
    document.querySelectorAll('[data-set]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.set === window.CL_EPSET));
    const toSeasons = (wrap) => { const el = wrap && wrap.querySelector('.seasons'); if (!el) return; wrap.scrollTop += el.getBoundingClientRect().top - wrap.getBoundingClientRect().top - 8; };
    if (location.hash.slice(1) === 'comparer' && refillCmp) { refillCmp(); toSeasons($('#pa')); toSeasons($('#pb')); }
    else if (location.hash.startsWith('#p-')) { const y = window.scrollY; detailNew(location.hash.slice(3)); window.scrollTo(0, y); const el = view.querySelector('.stagewrap .seasons'); if (el) window.scrollTo(0, window.scrollY + el.getBoundingClientRect().top - 12); }
    return;
  }
  if (t.dataset.f) { filter = t.dataset.f; galerie(); return; }
  if (t.dataset.step && stepCmp) { const [sd, dir] = t.dataset.step.split(':'); stepCmp(sd, +dir); return; }
  if (t.dataset.open) { location.hash = t.dataset.open; return; }
  if (t.dataset.cmp) { const k = t.dataset.cmp; if (cmp.b !== k) { if (cmp.a === k) cmp.a = cmp.b; cmp.b = k; } saveCmp(); location.hash = 'comparer'; return; }
  if (t.dataset.pick) {
    const k = t.dataset.pick; picked = picked.includes(k) ? picked.filter((x) => x !== k) : picked.concat(k); save();
    document.querySelectorAll('[data-pick="' + k + '"]').forEach((b) => { const on = picked.includes(k); b.setAttribute('aria-pressed', on); b.innerHTML = svg('star') + (on ? 'Retenue' : 'Retenir'); const c = b.closest('.pc'); if (c) c.classList.toggle('is-picked', on); });
    showPicked();
  }
});
document.addEventListener('keydown', (e) => { const t = e.target.closest && e.target.closest('.thumb'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); location.hash = t.dataset.open; } });
let keepScroll = false;
document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.altKey || e.ctrlKey || e.metaKey || (e.target.closest && e.target.closest('select,input,textarea'))) return;
  const dir = e.key === 'ArrowRight' ? 1 : -1, h = location.hash.slice(1);
  if (h === 'comparer' && stepCmp) { e.preventDefault(); stepCmp(e.shiftKey ? 'a' : 'b', dir); return; }
  let list = null, pre = '';
  if (h.startsWith('p-')) { list = D.map((d) => d.id); pre = 'p-'; } else if (h.startsWith('a-')) { list = OLD.map((o) => o.id); pre = 'a-'; }
  if (!list) return;
  e.preventDefault();
  const i = list.indexOf(h.slice(2));
  keepScroll = true; location.replace('#' + pre + list[(i + dir + list.length) % list.length]);
});
window.addEventListener('hashchange', () => { const y = window.scrollY; route(); window.scrollTo(0, keepScroll ? y : 0); keepScroll = false; });
route();
})();
</script>
